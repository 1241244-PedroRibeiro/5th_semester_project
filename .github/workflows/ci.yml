name: Continuous Integration (CI) - LaPrizza

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    # Daily CI validation on main branch at 03:00 UTC
    # Aligned with config/deploy-schedule.yml ci_validation schedule
    - cron: "0 3 * * *"

jobs:
  security-audit:
    name: Secrets & Security Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  backend-ci:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laprizza_user
          POSTGRES_PASSWORD: laprizza_password
          POSTGRES_DB: laprizza_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation (Build)
        run: npm run build

      - name: Execute Automated Test Suite (Jest / Supertest)
        run: npm test -- --coverage
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: laprizza_user
          DB_PASSWORD: laprizza_password
          DB_NAME: laprizza_db
          JWT_SECRET: test-ci-secret-key-32-bytes-minimum-length-2026

      - name: Archive Test Results & Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-coverage
          path: backend/coverage
          retention-days: 90
