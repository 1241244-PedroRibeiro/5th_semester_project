info:
  name: 03 - Callback User Cancelled (Access Denied)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/auth/external/callback?error=access_denied&state=123"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Redirects to frontend with cancelled error", function() {
          expect(res.getStatus()).to.equal(302);
          const location = res.getHeader("Location");
          expect(location).to.include("/auth/callback?error=cancelled");
        });

settings:
  encodeUrl: false
  timeout: inherit
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: true
