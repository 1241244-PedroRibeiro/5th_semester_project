info:
  name: 02 - Reject unknown invitation
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/auth/invitation/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("Expected HTTP 404", () => expect(res.getStatus()).to.equal(404));
        test("Does not disclose invitation details", () => {
          const data = res.getBody();
          expect(data).not.to.have.property("maskedEmail");
          expect(data).not.to.have.property("valid", true);
        });
