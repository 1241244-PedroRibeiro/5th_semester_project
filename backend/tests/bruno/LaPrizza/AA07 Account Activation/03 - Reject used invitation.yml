info:
  name: 03 - Reject used invitation
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/auth/invitation/{{usedActivationToken}}'
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("Expected HTTP 410", () => expect(res.getStatus()).to.equal(410));
        test("Reports an unavailable invitation", () => {
          const data = res.getBody();
          expect(data.error.message).to.match(/expired|used|revoked/i);
        });
