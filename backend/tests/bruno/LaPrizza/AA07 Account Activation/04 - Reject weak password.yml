info:
  name: 04 - Reject weak password
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/auth/activate'
  auth:
    type: none
  body:
    type: json
    data: |-
      {"token":"{{activationToken}}","password":"{{weakPassword}}"}
runtime:
  scripts:
    - type: tests
      code: |-
        test("Expected HTTP 422", () => expect(res.getStatus()).to.equal(422));
        test("Does not activate the account", () => {
          const data = res.getBody();
          expect(data).not.to.have.property("token");
          expect(data.error.message).to.match(/password|policy|requisitos/i);
        });
