info:
  name: 05 - Business - Unknown SKU (422)
  type: http
  seq: 6
http:
  method: POST
  url: "{{baseUrl}}/planning/bom-executions"
  body:
    type: json
    data: |-
      {
        "orders": [ { "productSku": "PIZZA-DOES-NOT-EXIST", "pizzaSize": "Medium", "quantity": 1 } ],
        "isSimulated": true,
        "source": "simulated"
      }
  auth:
    type: bearer
    token: "{{managerToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 422 Unprocessable", function() {
          expect(res.getStatus()).to.equal(422);
        });
        test("Error lists the unknown SKU", function() {
          expect(res.getBody().error.message).to.include("PIZZA-DOES-NOT-EXIST");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
