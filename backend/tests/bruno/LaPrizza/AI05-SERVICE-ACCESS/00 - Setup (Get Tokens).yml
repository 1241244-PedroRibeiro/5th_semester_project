info:
  name: 00 - Setup (Get Tokens)
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      { "email": "manager@laprizza.test", "password": "Manager123!" }
runtime:
  scripts:
    - type: post-response
      code: |-
        if (res.getBody().token) {
          bru.setVar("managerToken", res.getBody().token);
          bru.setEnvVar("managerToken", res.getBody().token);
        }
    - type: tests
      code: |-
        test("Stores manager token", function() {
          expect(res.getStatus()).to.equal(200);
          const token = res.getBody().token;
          expect(token).to.be.a("string").and.not.empty;
          bru.setVar("managerToken", token);
          bru.setEnvVar("managerToken", token);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
