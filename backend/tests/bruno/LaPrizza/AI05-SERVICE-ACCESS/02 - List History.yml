http:
  method: GET
  url: "{{baseUrl}}/planning/executions?pageSize=20&pageStartIndex=0"
  auth:
    type: bearer
    token: "{{managerToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() { expect(res.getStatus()).to.equal(200); });
