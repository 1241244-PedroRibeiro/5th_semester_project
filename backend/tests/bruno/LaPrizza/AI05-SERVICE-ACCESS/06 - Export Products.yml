info:
  name: 06 - Export Products
  type: http
  seq: 7
http:
  method: GET
  url: "{{baseUrl}}/products/export"
  auth:
    type: bearer
    token: "{{managerToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() { expect(res.getStatus()).to.equal(200); });
        test("Returns business-key product export", function() {
          expect(res.getBody().products).to.be.an("array").and.not.empty;
          expect(res.getBody().products[0].sku).to.be.a("string");
          expect(res.getBody().products[0].sku).to.not.match(/^[0-9a-f-]{36}$/i);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
