info:
  name: 02 - Export Knowledge Base
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/products/export"
  auth:
    type: bearer
    token: "{{ai06ManagerToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();
        test("Manager export succeeds", function() { expect(res.getStatus()).to.equal(200); });
        test("Returns complete KB sections", function() {
          expect(body.exportedAt).to.be.a("string");
          expect(body.products).to.be.an("array").and.not.empty;
          expect(body.boms).to.be.an("array").and.not.empty;
          expect(body.componentSizeConfigurations).to.be.an("array").and.not.empty;
        });
        test("Uses business keys and required product fields", function() {
          const product = body.products[0];
          expect(product.sku).to.be.a("string");
          expect(product.isActive).to.be.a("boolean");
          expect(product).to.not.have.property("active");
          expect(product.sku).to.not.match(/^[0-9a-f-]{36}$/i);
        });
        test("Preserves size-dependent stock consumption", function() {
          const configuration = body.componentSizeConfigurations[0];
          expect(configuration.componentSku).to.be.a("string");
          expect(configuration.pizzaSize).to.be.a("string");
          expect(configuration.stockUnitsConsumed).to.be.a("number");
        });
        test("Excludes personal data", function() {
          const forbidden = /(password|email|phone|address|dietary|external_idp_subject)/i;
          function assertClean(value) {
            if (Array.isArray(value)) return value.forEach(assertClean);
            if (value && typeof value === "object") {
              Object.entries(value).forEach(([key, child]) => {
                expect(key).to.not.match(forbidden);
                assertClean(child);
              });
            }
          }
          assertClean(body);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
