info:
  name: 08 - Wrong Password (Unauthorized)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
      	"email": "{{authTestEmail}}",
      	"password": "WrongPassword123!"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 401", function() {
        	expect(res.getStatus()).to.equal(401);
        });

        test("Returns the expected error without credentials", function() {
        	const data = res.getBody();
        	expect(data.error.message).to.equal("Invalid email or password");
        	expect(data).not.to.have.property("token");
        	expect(data).not.to.have.property("user");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
