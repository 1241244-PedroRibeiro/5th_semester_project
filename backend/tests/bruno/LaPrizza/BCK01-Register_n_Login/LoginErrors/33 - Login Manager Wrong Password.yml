info:
  name: 33 - Login Manager Wrong Password
  type: http
  seq: 33
http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
      	"email": "manager@laprizza.test",
      	"password": "WrongPassword123!"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 401", function() {
        	expect(res.getStatus()).to.equal(401);
        });

        test("Rejects login without exposing credentials", function() {
        	const data = res.getBody();
        	expect(data.error.message).to.equal("Invalid email or password");
        	expect(data).not.to.have.property("token");
        	expect(data).not.to.have.property("user");
        });
