info:
  name: 15 - Pre-register Invalid Token (Unauthorized)
  type: http
  seq: 15
http:
  method: POST
  url: "{{baseUrl}}/auth/pre_register"
  body:
    type: json
    data: |-
      {
      	"firstName": "Bruno",
      	"lastName": "Staff",
      	"email": "{{preRegisterEmail}}",
      	"roleName": "EMPLOYEE"
      }
  auth:
    type: bearer
    token: invalid-token
runtime:
  scripts:
    - type: before-request
      code: bru.setVar("preRegisterEmail", "bruno-staff-" + Date.now() + "-" + Math.random().toString(36).slice(2) + "@example.com");
    - type: tests
      code: |-
        test("Status code is 401", function() {
        	expect(res.getStatus()).to.equal(401);
        });

        test("Returns the expected error without exposing credentials", function() {
        	const data = res.getBody();
        	expect(data.error.message).to.equal("Invalid or expired token.");
        	expect(data).not.to.have.property("token");
        	expect(data).not.to.have.property("password");
        	expect(data).not.to.have.property("passwordHash");
        });

        test("Advertises Bearer authentication", function() {
        	expect(res.getHeader("www-authenticate")).to.equal("Bearer");
        });
