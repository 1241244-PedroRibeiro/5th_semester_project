info:
  name: 03 - Invalid Registration Email
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
      	"firstName": "Bruno",
      	"lastName": "Customer",
      	"email": "invalid-email",
      	"password": "{{authTestPassword}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400", function() {
        	expect(res.getStatus()).to.equal(400);
        });

        test("Returns the expected error without credentials", function() {
        	const data = res.getBody();
        	expect(data.error.message).to.equal("Invalid email address format");
        	expect(data).not.to.have.property("token");
        	expect(data).not.to.have.property("user");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
