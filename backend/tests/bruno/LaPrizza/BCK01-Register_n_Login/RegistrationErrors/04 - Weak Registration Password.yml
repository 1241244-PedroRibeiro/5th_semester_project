info:
  name: 04 - Weak Registration Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
      	"firstName": "Bruno",
      	"lastName": "Customer",
      	"email": "weak-{{authTestEmail}}",
      	"password": "short"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400", function() {
        	expect(res.getStatus()).to.equal(400);
        });

        test("Returns the expected error without credentials", function() {
        	const data = res.getBody();
        	expect(data.error.message).to.equal("Password must be at least 8 characters long and include an uppercase letter, a lowercase letter, a number, and a special character");
        	expect(data).not.to.have.property("token");
        	expect(data).not.to.have.property("user");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
