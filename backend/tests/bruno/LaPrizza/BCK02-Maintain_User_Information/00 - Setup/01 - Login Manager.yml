info:
  name: 01 - Login Manager
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  body:
    type: json
    data: |-
      {
      	"email": "manager@laprizza.test",
      	"password": "Manager123!"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("Obtains this suite's manager credentials", function() {
        	expect(res.getStatus()).to.equal(200);
        	const data = res.getBody();
        	expect(data.user.roles).to.include("MANAGER");
        	expect(data.user.status).to.equal("ACTIVE");
        	expect(data.token).to.be.a("string").and.not.empty;
        	bru.setVar("bck02ManagerToken", data.token);
        	bru.setVar("bck02ManagerUsername", data.user.username);
        });
