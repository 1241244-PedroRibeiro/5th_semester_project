info:
  name: 04 - Select Seeded Allergen
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/allergens'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Selects an allergen independently of BCK04", function() {
        	expect(res.getStatus()).to.equal(200);
        	const allergens = res.getBody();
        	expect(allergens).to.be.an("array").and.not.empty;
        	const allergen = allergens.find(a => a.name === "Gluten") || allergens[0];
        	expect(allergen.name).to.be.a("string").and.not.empty;
        	expect(allergen.name).to.be.a("string").and.not.empty;
        	bru.setVar("bck02AllergenName", allergen.name);
        });
