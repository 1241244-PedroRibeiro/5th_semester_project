info:
  name: 03 - Customer Cannot Read Nonexistent User
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/user/{{bck02NonexistentUsername}}'
  auth:
    type: bearer
    token: '{{bck02CustomerToken}}'
runtime:
  scripts:
    - type: before-request
      code: 'bru.setVar("bck02NonexistentUsername", "bruno-missing-" + Date.now());'
    - type: tests
      code: |-
        test("Status code is 403", function() {
        	expect(res.getStatus()).to.equal(403);
        });

        test("Rejects access without disclosing user information", function() {
        	const data = res.getBody();
        	expect(data.error.message).to.equal("You can only view your own user information.");
        	expect(data).not.to.have.property("username");
        	expect(data).not.to.have.property("email");
        	expect(data).not.to.have.property("passwordHash");
        });
