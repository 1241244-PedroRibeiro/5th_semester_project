info:
  name: 02 - Filter By Role
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/users/filter/role/CUSTOMER?page=1&pageSize=2'
  auth:
    type: bearer
    token: '{{bck02ManagerToken}}'
runtime:
  scripts:
    - type: before-request
      code: |-
        const value = name => bru.getVar(name) ?? bru.getEnvVar(name);
        for (const name of ["bck02ManagerToken"]) {
        	if (!value(name)) throw new Error("Run BCK02's setup and preceding filter requests first: missing " + name);
        }
    - type: tests
      code: |-
        test("Status code is 200", function() {
        	expect(res.getStatus()).to.equal(200);
        });

        test("Returns a valid public user page", function() {
        	const data = res.getBody();
        	expect(data).to.have.all.keys("items", "total", "page", "pageSize", "totalPages");
        	expect(data.page).to.equal(1);
        	expect(data.pageSize).to.equal(2);
        	expect(data.total).to.be.a("number").and.to.be.at.least(0);
        	expect(data.totalPages).to.equal(Math.ceil(data.total / 2));
        	expect(data.items).to.be.an("array");
        	expect(data.items.length).to.equal(Math.min(2, Math.max(0, data.total - (data.page - 1) * 2)));
        	for (const user of data.items) {
        		expect(user).to.have.all.keys("username", "firstName", "lastName", "createdAt", "email", "roles", "status");
        		expect(user).not.to.have.property("passwordHash");
        		expect(user).not.to.have.property("updatedAt");
        		expect(user.roles).to.include("CUSTOMER");
        	}
        });

        test("Records first-page identities for the next pagination request", function() {
        	bru.setVar("bck02FilterFirstPageUsernames", res.getBody().items.map(user => user.username));
        });
