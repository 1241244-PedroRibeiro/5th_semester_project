info:
  name: 10 - Filter Status Without Token
  type: http
  seq: 10
http:
  method: GET
  url: '{{baseUrl}}/users/filter/status/ACTIVE'
runtime:
  scripts:
    - type: before-request
      code: |-
        const value = name => bru.getVar(name) ?? bru.getEnvVar(name);
        for (const name of []) {
        	if (!value(name)) throw new Error("Run BCK02's setup and preceding filter requests first: missing " + name);
        }
    - type: tests
      code: |-
        test("Status code is 401", function() {
        	expect(res.getStatus()).to.equal(401);
        });

        test("Returns an error without listing users", function() {
        	const data = res.getBody();
        	expect(data.error.message).to.be.a("string").and.not.empty;
        	expect(data).not.to.have.property("items");
        });
