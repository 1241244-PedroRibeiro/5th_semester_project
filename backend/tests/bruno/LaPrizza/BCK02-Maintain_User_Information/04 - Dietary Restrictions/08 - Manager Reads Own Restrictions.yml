info:
  name: 08 - Manager Reads Own Restrictions
  type: http
  seq: 8
http:
  method: GET
  url: '{{baseUrl}}/user/{{bck02ManagerUsername}}/allergens'
  auth:
    type: bearer
    token: '{{bck02ManagerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function() {
        	expect(res.getStatus()).to.equal(200);
        });

        test("Returns the selected user's allergen names", function() {
        	const data = res.getBody();
        	expect(data.username).to.equal((bru.getVar("bck02ManagerUsername") ?? bru.getEnvVar("bck02ManagerUsername")));
        	expect(data.allergens).to.be.an("array");
        	data.allergens.forEach(name => expect(name).to.be.a("string"));
        });
