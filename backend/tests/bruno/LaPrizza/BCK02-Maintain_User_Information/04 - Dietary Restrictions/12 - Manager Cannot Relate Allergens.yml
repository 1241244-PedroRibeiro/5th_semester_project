info:
  name: 12 - Manager Cannot Relate Allergens
  type: http
  seq: 12
http:
  method: POST
  url: '{{baseUrl}}/user/{{bck02CustomerUsername}}/allergen'
  body:
    type: json
    data: |-
      {
      	"allergens": [
      		"{{bck02AllergenName}}"
      	]
      }
  auth:
    type: bearer
    token: '{{bck02ManagerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 403", function() {
        	expect(res.getStatus()).to.equal(403);
        });

        test("Returns an error message", function() {
        	expect(res.getBody().error.message).to.be.a("string").and.not.empty;
        });
