info:
  name: 16 - Relate With Invalid Token
  type: http
  seq: 16
http:
  method: POST
  url: '{{baseUrl}}/user/{{bck02CustomerUsername}}/allergen'
  body:
    type: json
    data: |-
      {
      	"allergens": [
      		"{{bck02AllergenName}}"
      	]
      }
  auth:
    type: bearer
    token: invalid.jwt.token
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 401", function() {
        	expect(res.getStatus()).to.equal(401);
        });

        test("Returns an error message", function() {
        	expect(res.getBody().error.message).to.be.a("string").and.not.empty;
        });
