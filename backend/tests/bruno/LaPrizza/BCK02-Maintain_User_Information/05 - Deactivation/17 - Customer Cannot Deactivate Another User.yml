info:
  name: 17 - Customer Cannot Deactivate Another User
  type: http
  seq: 17
http:
  method: DELETE
  url: '{{baseUrl}}/user/{{bck02ManagerUsername}}'
  auth:
    type: bearer
    token: '{{bck02CustomerToken}}'
runtime:
  scripts:
    - type: before-request
      code: |-
        const value = name => bru.getVar(name) ?? bru.getEnvVar(name);
        for (const name of ["bck02CustomerToken", "bck02CustomerUsername", "bck02ManagerUsername"]) {
        	if (!value(name)) throw new Error("Set " + name + " before running this request.");
        }
        if (value("bck02CustomerUsername") === value("bck02ManagerUsername")) {
        	throw new Error("Customer and manager usernames must be different.");
        }
    - type: tests
      code: |-
        test("Status code is 401", function() {
        	expect(res.getStatus()).to.equal(401);
        });

        test("Rejects deactivation of another user", function() {
        	expect(res.getBody().error.message).to.equal("You are not allowed to deactivate/remove this user!");
        });
