info:
  name: 03 - Reject Invalid Phone Number
  type: http
  seq: 3
http:
  method: PUT
  url: '{{baseUrl}}/user/me/phone-number'
  body:
    type: json
    data: |-
      {
        "phoneNumber": "912345678"
      }
  auth:
    type: bearer
    token: '{{bck02PhoneToken}}'
settings:
  encodeUrl: true
runtime:
  scripts:
    - type: tests
      code: |-
        test("Reject Invalid Phone Number", function() {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody()).to.deep.equal({ error: { message: "Phone number must use international E.164 format" } });
        });
