info:
  name: 05 - Reject Phone Without Authentication
  type: http
  seq: 5
http:
  method: PUT
  url: '{{baseUrl}}/user/me/phone-number'
  body:
    type: json
    data: |-
      {
        "phoneNumber": "+351912345678"
      }
settings:
  encodeUrl: true
runtime:
  scripts:
    - type: after-response
      code: |-
        const cleanup = await bru.sendRequest({
          method: "DELETE",
          validateStatus: () => true,
          url: bru.getEnvVar("baseUrl") + "/user/" + encodeURIComponent(bru.getVar("bck02PhoneUsername")),
          headers: { Authorization: "Bearer " + bru.getVar("bck02PhoneToken") }
        });
        if (cleanup.status !== 200) {
          throw new Error("Contact fixture deactivation failed: HTTP " + cleanup.status + " " + JSON.stringify(cleanup.data));
        }
    - type: tests
      code: |-
        test("Reject Phone Without Authentication", function() {
          expect(res.getStatus()).to.equal(401);
          expect(res.getBody()).to.deep.equal({ error: { message: "Authentication required." } });
        });
