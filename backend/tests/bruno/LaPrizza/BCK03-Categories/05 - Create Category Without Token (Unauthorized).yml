info:
  name: 05 - Create Category Without Token (Unauthorized)
  type: http
  seq: 7
http:
  method: POST
  url: '{{baseUrl}}/categories'
  body:
    type: json
    data: |-
      {
        "categoryName": "Anonymous Category",
        "description": "Unauthorized attempt"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejects creation without token with 401 Unauthorized", function() {
          expect(res.getStatus()).to.equal(401);
          expect(res.getBody().error.message).to.equal("Authentication required.");
        });
