info:
  name: 11 - Create Category Empty Name (Bad Request)
  type: http
  seq: 11
http:
  method: POST
  url: '{{baseUrl}}/categories'
  body:
    type: json
    data: |-
      {
        "categoryName": "",
        "description": "Valid description"
      }
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Empty name returns 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error.message).to.equal("CategoryName cannot be empty");
        });
