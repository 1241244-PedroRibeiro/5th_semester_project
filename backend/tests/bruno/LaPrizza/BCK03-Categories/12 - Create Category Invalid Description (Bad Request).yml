info:
  name: 12 - Create Category Invalid Description (Bad Request)
  type: http
  seq: 12
http:
  method: POST
  url: '{{baseUrl}}/categories'
  body:
    type: json
    data: |-
      {
        "categoryName": "Invalid Description",
        "description": 123
      }
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Invalid description returns 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error.message).to.equal("description must be a string.");
        });
