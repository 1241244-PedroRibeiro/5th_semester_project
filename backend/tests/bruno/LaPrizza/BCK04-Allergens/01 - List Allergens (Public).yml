info:
  name: 01 - List Allergens (Public)
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/allergens'
  body: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("Public allergen listing returns 200 OK", function() {
        	expect(res.getStatus()).to.equal(200);
        	const data = res.getBody();
        	expect(data).to.be.an("array");
        	bru.setVar("allergenList", data);
        	if (data.length > 0) {
        		bru.setVar("seededAllergenName", data[0].name);
        	}
        });
