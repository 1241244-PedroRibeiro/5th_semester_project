info:
  name: 12 - Create Allergen Empty Name (Bad Request)
  type: http
  seq: 11
http:
  method: POST
  url: '{{baseUrl}}/allergens'
  body:
    type: json
    data: |-
      {
      	"name": "",
      	"description": "Valid description"
      }
  auth:
    type: bearer
