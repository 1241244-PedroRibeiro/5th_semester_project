info:
  name: 02 - Get Product by Non-Existent SKU (Not Found)
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/products/PRD-NON-EXISTENT'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Non-existent product code returns 404 Not Found", function() {
        	expect(res.getStatus()).to.equal(404);
        	expect(res.getBody().error.message).to.equal("Product not found");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
