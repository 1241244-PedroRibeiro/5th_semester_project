info:
  name: 06 - Create Pizza Component Product (Manager Success)
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/products'
  body:
    type: json
    data: |-
      {
          "sku": "{{pizzaCompSku}}",
          "name": "Fresh Tomato Sauce {{pizzaCompSku}}",
          "description": "Component only",
          "categoryName": "Ingredients",
          "isSellable": false,
          "isPizzaComponent": true,
          "isStockControlled": true,
          "componentTypeName": "Base Sauce",
          "directSellingPrice": null
      }
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: before-request
      code: 'bru.setVar("pizzaCompSku", "PRD-COMP-" + Date.now() + "-" + Math.floor(Math.random() * 1000));'
    - type: tests
      code: |-
        test("Manager creates pizza component returning 201 Created", function() {
            expect(res.getStatus()).to.equal(201);
        });