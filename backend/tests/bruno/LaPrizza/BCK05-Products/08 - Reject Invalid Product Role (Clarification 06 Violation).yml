  url: '{{baseUrl}}/products'
  body:
    type: json
    data: |-
      {
          "name": "Ghost Item",
          "description": "Exclusively stock controlled",
          "categoryName": "Beverages",
          "isSellable": false,
          "isPizzaComponent": false,
          "isStockControlled": true,
          "sku": "PRD-GHOST"
      }
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejects invalid role combination with 400 Bad Request", function() {
            expect(res.getStatus()).to.equal(400);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
