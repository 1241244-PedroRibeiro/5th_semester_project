info:
  name: 14 - Filter Products by Category (Public)
  type: http
  seq: 17
http:
  method: GET
  url: '{{baseUrl}}/products?category=Beverages'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Filter by category returns 200 OK with matching products", function() {
        	expect(res.getStatus()).to.equal(200);
        	const data = res.getBody();
        	expect(Array.isArray(data)).to.be.true;
        	expect(data.some(p => p.categoryName === "Beverages")).to.be.true;
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
