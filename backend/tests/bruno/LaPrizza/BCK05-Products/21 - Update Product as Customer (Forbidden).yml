info:
  name: 21 - Update Product as Customer (Forbidden)
  type: http
  seq: 24
http:
  method: PUT
  url: '{{baseUrl}}/products/{{sellableProductSku}}'
  body:
    type: json
    data: |-
      {
      	"name": "Customer Modification",
      	"description": "Should fail"
      }
  auth:
    type: bearer
    token: '{{customerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Customer cannot update product (403 Forbidden)", function() {
        	expect(res.getStatus()).to.equal(403);
        	expect(res.getBody().error.message).to.equal("You do not have permission to do this.");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
