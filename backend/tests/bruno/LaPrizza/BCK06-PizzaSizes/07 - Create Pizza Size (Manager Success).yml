info:
  name: 07 - Create Pizza Size (Manager Success)
  type: http
  seq: 9
http:
  method: POST
  url: '{{baseUrl}}/pizza-sizes'
  body:
    type: json
    data: |-
      {
      	"name": "{{newSizeName}}"
      }
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("managerToken") && !bru.getEnvVar("managerToken")) {
        	throw new Error("managerToken is required; run request 00 first.");
        }
        const suffix = Date.now().toString().slice(-4);
        bru.setVar("newSizeName", "Family " + suffix);
    - type: tests
      code: |-
        test("Manager creates pizza size returning 201 Created", function() {
        	expect(res.getStatus()).to.equal(201);
        	const data = res.getBody();
        	expect(data.name).to.equal(bru.getVar("newSizeName"));
        	expect(data.active).to.be.true;
        	bru.setVar("createdSizeName", data.name);
        	bru.setEnvVar("createdSizeName", data.name);
        });
