info:
  name: 13 - Deactivate Pizza Size via Update (Soft Evolution AC5)
  type: http
  seq: 15
http:
  method: PUT
  url: '{{baseUrl}}/pizza-sizes/{{updatedSizeName}}'
  body:
    type: json
    data: |-
      {
      	"name": "{{updatedSizeName}}",
      	"active": false
      }
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Manager deactivates pizza size returning 200 OK", function() {
        	expect(res.getStatus()).to.equal(200);
        	const data = res.getBody();
        	expect(data.active).to.be.false;
        });