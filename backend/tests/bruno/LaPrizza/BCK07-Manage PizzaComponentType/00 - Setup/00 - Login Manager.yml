info:
  name: 00 - Login Manager
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  body:
    type: json
    data: |-
      {
      	"email": "manager@laprizza.test",
      	"password": "Manager123!"
      }
settings:
  encodeUrl: true
runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
        bru.setVar("bck07Name", "Bruno BCK07 " + suffix);
        bru.setVar("bck07ProductSku", "PRD-B07-" + suffix.toUpperCase());
    - type: tests
      code: |-
        test("Login Manager", function() {
        	expect(res.getStatus()).to.equal(200);
        	const data = res.getBody();
        	expect(typeof data.token).to.equal("string");
        	expect(data.token.length > 0).to.equal(true);
        	expect(data.user.roles.includes("MANAGER")).to.equal(true);
        	expect(data.user.status).to.equal("ACTIVE");
        	bru.setVar("bck07ManagerToken", data.token);
        });
