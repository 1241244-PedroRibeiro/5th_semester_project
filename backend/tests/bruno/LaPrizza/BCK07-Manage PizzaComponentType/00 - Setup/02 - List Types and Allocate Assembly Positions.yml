info:
  name: 02 - List Types and Allocate Assembly Positions
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/pizza-component-types?page=1&pageSize=20'
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status !== 200) {
          throw new Error("Cannot allocate BCK07 assembly orders: component type listing failed");
        }
        const allTypes = [...res.body.items];
        for (let page = 2; page <= res.body.totalPages; page++) {
          const response = await bru.sendRequest({
            method: "GET",
            url: bru.getEnvVar("baseUrl") + "/pizza-component-types?page=" + page + "&pageSize=20"
          });
          if (response.status !== 200) {
            throw new Error("Cannot allocate BCK07 assembly orders: page " + page + " failed");
          }
          allTypes.push(...response.data.items);
        }
        bru.setVar("bck07SetupTypes", allTypes);
        if (res.status === 200 && res.body.items.length > 0) {
          const topping = res.body.items.find((t) => t.name === "Topping");
          if (topping) {
            bru.setVar("componentTypeName", topping.name);
          }
        }
    - type: tests
      code: |-
        test("Matches the current API contract", function() {
          expect(res.getStatus()).to.equal(200);
          const data = bru.getVar("bck07SetupTypes");
          expect(data).to.be.an("array").and.not.empty;
          const orders = data.map(type => type.assemblyOrder);
          expect(orders).to.deep.equal([...orders].sort((a, b) => a - b));
          expect(new Set(orders).size).to.equal(orders.length);
          for (const [name, order, min, max] of [["Base Dough", 1, 1, 1], ["Base Sauce", 2, 0, 1], ["Cheese", 3, 0, 1], ["Topping", 4, 0, null]]) {
            const type = data.find(type => type.name === name);
            expect(type).to.exist;
            expect([type.assemblyOrder, type.minCardinality, type.maxCardinality]).to.deep.equal([order, min, max]);
          }
          const nextOrder = Math.max(...orders) + 1;
          bru.setVar("bck07Order", nextOrder);
          bru.setVar("bck07UpdatedOrder", nextOrder + 1);
          bru.setVar("bck07ReferencedOrder", nextOrder + 2);
          bru.setVar("bck07BoundedOrder", nextOrder + 3);
          bru.setVar("bck07ExistingName", data[0].name);
          bru.setVar("bck07ExistingOrder", data[0].assemblyOrder);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
