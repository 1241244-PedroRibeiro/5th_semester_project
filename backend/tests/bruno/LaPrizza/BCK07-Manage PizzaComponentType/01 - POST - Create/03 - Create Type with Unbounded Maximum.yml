info:
  name: 03 - Create Type with Unbounded Maximum
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/pizza-component-types'
  body:
    type: json
    data: |-
      {
        "name": " {{bck07Name}} ",
        "assemblyOrder": {{bck07Order}},
        "minCardinality": 0,
        "maxCardinality": null
      }
  auth:
    type: bearer
    token: '{{bck07ManagerToken}}'
settings:
  encodeUrl: true
runtime:
  scripts:
    - type: tests
      code: |-
        test("Create Type with Unbounded Maximum", function() {
          expect(res.getStatus()).to.equal(201);
          const data = res.getBody();
          expect(data.name).to.be.a("string").and.not.empty;
          expect(data.name).to.equal(bru.getVar("bck07Name"));
          expect(data.assemblyOrder).to.equal(bru.getVar("bck07Order"));
          expect(data.minCardinality).to.equal(0);
          expect(data.maxCardinality).to.equal(null);
          bru.setVar("bck07Name", data.name);
        });
