info:
  name: 05 - Reject Duplicate Name
  type: http
  seq: 5
http:
  method: POST
  url: '{{baseUrl}}/pizza-component-types'
  body:
    type: json
    data: |-
      {
        "name": "{{bck07Name}}",
        "assemblyOrder": {{bck07UpdatedOrder}},
        "minCardinality": 0,
        "maxCardinality": null
      }
  auth:
    type: bearer
    token: '{{bck07ManagerToken}}'
settings:
  encodeUrl: true
runtime:
  scripts:
    - type: tests
      code: |-
        test("Reject Duplicate Name", function() {
          expect(res.getStatus()).to.equal(409);
          expect(res.getBody().error.message).to.equal("Component type code, name or assembly order already exists");
        });
