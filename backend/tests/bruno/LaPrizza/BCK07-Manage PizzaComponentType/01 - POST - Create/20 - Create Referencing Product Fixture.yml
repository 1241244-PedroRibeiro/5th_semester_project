info:
  name: 20 - Create Referencing Product Fixture
  type: http
  seq: 20
http:
  method: POST
  url: '{{baseUrl}}/products'
  body:
    type: json
    data: |-
      {
        "name": "{{bck07Name}} ingredient",
        "description": "Bruno BCK07 reference protection fixture",
        "categoryName": "Ingredients",
        "isSellable": false,
        "isPizzaComponent": true,
        "isStockControlled": false,
        "componentTypeName": "{{bck07ReferencedName}}",
        "sku": "{{bck07ProductSku}}",
        "directSellingPrice": 2
      }
  auth:
    type: bearer
    token: '{{bck07ManagerToken}}'
runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = Date.now() + "-" + Math.random().toString(36).slice(2, 8);
        bru.setVar("bck07ProductSku", "PRD-PRICED-REF-" + suffix);
    - type: tests
      code: |-
        test("Matches the current API contract", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().sku).to.equal(bru.getVar("bck07ProductSku"));
          expect(res.getBody().directSellingPrice).to.equal(2);
          bru.setVar("bck07ProductSku", res.getBody().sku);
        });
