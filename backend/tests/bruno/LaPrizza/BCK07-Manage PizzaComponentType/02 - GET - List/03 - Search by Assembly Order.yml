info:
  name: 03 - Search by Assembly Order
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/pizza-component-types?search={{bck07Order}}&page=1&pageSize=20'
settings:
  encodeUrl: true
runtime:
  scripts:
    - type: tests
      code: |-
        test("Search by Assembly Order", function() {
          expect(res.getStatus()).to.equal(200);
          const data = res.getBody().items;
          const order = bru.getVar("bck07Order");
          expect(data.some(type => type.assemblyOrder === order && type.name === bru.getVar("bck07Name"))).to.equal(true);
          expect(data.every(type => type.assemblyOrder === order || type.name.includes(String(order)))).to.equal(true);
        });
