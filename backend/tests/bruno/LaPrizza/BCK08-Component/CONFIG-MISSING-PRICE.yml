  body:
    type: json
    data: |-
      {
      	"pizzaSize": "Small",
      	"stockUnitsConsumed": 2,
      	"componentSku": "{{componentProductSku}}"
      }
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Matches the current API contract", function() {
        	expect(res.getStatus()).to.equal(400);
        	expect(res.getBody().error.message).to.be.a("string").and.not.empty;
        });
