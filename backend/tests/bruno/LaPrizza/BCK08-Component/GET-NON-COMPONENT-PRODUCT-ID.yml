info:
  name: GET-NON-COMPONENT-PRODUCT-Identifier
  type: http
  seq: 14
http:
  method: GET
  url: '{{baseUrl}}/stock?search={{nonComponentName}}'
  params:
    - name: search
      value: '{{nonComponentName}}'
      type: query
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Matches the current API contract", function() {
        	expect(res.getStatus()).to.equal(200);
        	const item = res.getBody().find(item => item.productSku === bru.getVar("nonComponentSku"));
        	expect(item).to.exist;
        	bru.setVar("nonComponentSku", item.productSku);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
