info:
  name: SETUP-PRICED-COMPONENT
  type: http
  seq: 2
http:
  method: POST
  url: '{{baseUrl}}/products'
  body:
    type: json
    data: |-
      {
      	"name": "{{componentProductName}}",
      	"description": "Component for BCK08 tests",
      	"categoryName": "Beverages",
      	"isSellable": false,
      	"isPizzaComponent": true,
      	"isStockControlled": true,
      	"componentTypeName": "Topping",
      	"sku": "{{componentProductSku}}",
      	"directSellingPrice": 2
      }
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = Date.now() + "-" + Math.random().toString(36).slice(2, 8);
        bru.setVar("componentProductSku", "PRD-PRICED-CMP-" + suffix);
        bru.setVar("componentProductName", "Priced Component " + suffix);
    - type: tests
      code: |-
        test("Matches the current API contract", function() {
        	expect(res.getStatus()).to.equal(201);
        	expect(res.getBody().sku).to.equal(bru.getVar("componentProductSku"));
        	expect(res.getBody().directSellingPrice).to.equal(2);
        	bru.setVar("componentProductSku", res.getBody().sku);
        });
