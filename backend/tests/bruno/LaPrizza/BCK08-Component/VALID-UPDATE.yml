info:
  name: VALID-UPDATE
  type: http
  seq: 8
http:
  method: PUT
  url: '{{baseUrl}}/component-size-configurations/{{configId}}'
  body:
    type: json
    data: |-
      {
      	"price": 1.5,
      	"stockUnitsConsumed": 5
      }
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Matches the current API contract", function() {
        	expect(res.getStatus()).to.equal(200);
        	expect(res.getBody().id).to.equal(bru.getVar("configId"));
        	expect(res.getBody().price).to.equal(1.5);
        	expect(res.getBody().stockUnitsConsumed).to.equal(5);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
