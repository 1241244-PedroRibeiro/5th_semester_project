info:
  name: GET-INACTIVE-PRODUCT-STOCK
  type: http
  seq: 10
http:
  method: GET
  url: '{{baseUrl}}/stock/{{inactiveStockProductSku}}'
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Should return 200 for an inactive stock-controlled product", function () {
        	expect(res.status).to.equal(200);
        });

        test("Should return the requested product stock", function () {
        	expect(res.body.productSku).to.equal(bru.getVar("inactiveStockProductSku"));
        	expect(res.body).to.have.property("currentUnits");
        	expect(Number(res.body.currentUnits)).to.be.at.least(0);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
