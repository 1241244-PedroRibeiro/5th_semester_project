info:
  name: GET-STOCK-INACTIVE
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/stock/'
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
        	const item = res.body.find(
        		(i) => i.productName === bru.getVar("inactiveStockProductName")
        	);

        	if (item) {
        		bru.setVar("inactiveStockProductSku", item.productSku);
        		console.log("inactiveStockProductSku:", item.productSku);
        	} else {
        		console.log("Produto de teste não encontrado no stock");
        	}
        }
    - type: tests
      code: |-
        test("Stock query succeeds", function () {
        	expect(res.status).to.equal(200);
        });

        test("Stock response is present", function () {
        	expect(res.body).to.exist;
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
