info:
  name: 03 - Get BCK10 Dough Stock Identifier
  type: http
  seq: 5
http:
  method: GET
  url: '{{baseUrl}}/stock?search={{componentProductName}}'
  params:
    - name: search
      value: '{{componentProductName}}'
      type: query
  auth:
    type: bearer
    token: '{{managerToken}}'
runtime:
  scripts:
    - type: before-request
      code: 'bru.setVar("componentProductName", bru.getVar("bck10DoughName"));'
    - type: after-response
      code: |-
        if (res.status === 200) {
        	const name = bru.getVar("componentProductName");
        	const item = res.body.find((i) => i.productName === name);
        	if (item) {
        		bru.setVar("componentProductSku", item.productSku);
        	}
        }
    - type: tests
      code: |-
        test("returns HTTP 200", function () {
        	expect(res.status).to.equal(200);
        });

        test("response is a list", function () {
        	expect(res.body).to.be.an("array");
        });

        test("finds the component product", function () {
        	const name = bru.getVar("componentProductName");
        	const item = res.body.find((i) => i.productName === name);

        	expect(item).to.exist;
        	expect(bru.getVar("componentProductSku")).to.equal(item.productSku);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
