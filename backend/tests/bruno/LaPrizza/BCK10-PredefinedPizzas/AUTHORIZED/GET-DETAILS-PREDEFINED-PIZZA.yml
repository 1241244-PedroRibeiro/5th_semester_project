info:
  name: GET-DETAILS-PREDEFINED-PIZZA
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/predefined-pizzas/{{bck10PizzaSku}}?pizzaSize=Small'
  auth: inherit
  params:
    - name: pizzaSize
      value: Small
      type: query
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
runtime:
  scripts:
    - type: tests
      code: |-
        test("Gets predefined pizza details", function() {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().pizzaSku).to.equal(bru.getVar("bck10PizzaSku"));
            expect(res.getBody().supportedSizes).to.include("Small");
            expect(res.getBody().ids).to.deep.include({
                pizzaSku: bru.getVar("bck10PizzaSku"),
                pizzaSize: "Small"
            });
        });