info:
  name: 02 - Filter by Category
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/catalogue?category=Ingredients'
  params:
    - name: category
      value: Ingredients
      type: query
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns HTTP 200", function () {
        	expect(res.status).to.equal(200);
        });

        test("returns only products from Ingredients", function () {
        	expect(res.body).to.be.an("array");

        	expect(
        		res.body.every(product => product.categoryName === "Ingredients")
        	).to.equal(true);

        	const productSkus = res.body.map(
        		product => product.productSku
        	);

        	expect(productSkus).to.include(bru.getVar("dualProductSku"));
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
