info:
  name: 03 - Reset Password and Confirm Login
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/password-recovery/new_pass'
  body:
    type: json
    data: |-
      {
        "recovery_code": "{{recoveryCode}}",
        "new_password": "{{recoveryNewPassword}}"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const email = bru.getEnvVar("recoveryEmail");
        if (!email) throw new Error("Set recoveryEmail to a registered ACTIVE account with an inbox you control.");
        bru.setVar("recoveryEmail", email);
        const password = bru.getEnvVar("recoveryNewPassword");
        if (!password) throw new Error("Set recoveryNewPassword locally; use 8–128 characters with uppercase, lowercase, a number, and a symbol.");
        bru.setVar("recoveryNewPassword", password);
        const code = bru.getEnvVar("recoveryCode");
        if (!code || !/^[a-f0-9]{64}$/i.test(code.trim())) throw new Error("Set recoveryCode to the complete code received by email within the last 5 minutes.");
        bru.setVar("recoveryCode", code.trim());
    - type: tests
      code: |-
        test("Returns HTTP 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Returns a confirmation or explanation without recovery credentials", function() {
          const data = res.getBody();
          expect(data.message).to.be.a("string").and.not.empty;
          expect(data).not.to.have.property("recovery_code");
          expect(data).not.to.have.property("new_password");
          expect(data).not.to.have.property("passwordHash");
        });
        if (res.getStatus() === 200) {
          bru.setVar("recoveryUsedCode", bru.getVar("recoveryCode"));
          const login = await bru.sendRequest({ method: "POST", url: bru.getEnvVar("baseUrl") + "/auth/login",
            headers: { "Content-Type": "application/json" }, data: { email: bru.getVar("recoveryEmail"), password: bru.getVar("recoveryNewPassword") }, validateStatus: () => true });
          test("The new password authenticates the recovered account", function() {
            expect(login.status).to.equal(200);
            expect(login.data.token).to.be.a("string").and.not.empty;
            expect(login.data.user.email).to.equal(bru.getVar("recoveryEmail").trim().toLowerCase());
          });
        }
