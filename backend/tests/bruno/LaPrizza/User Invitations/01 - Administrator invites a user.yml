info:
  name: 01 - Administrator invites a user
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/auth/invite'
  auth:
    type: bearer
    token: '{{invitationToken}}'
  body:
    type: json
    data: |-
      {"email": "{{invitationEmail}}", "roleName": "EMPLOYEE"}
runtime:
  scripts:
    - type: before-request
      code: |-
        const actor = await bru.sendRequest({
          method: "POST", url: bru.getEnvVar("baseUrl") + "/auth/login",
          headers: { "Content-Type": "application/json" },
          data: { email: bru.getEnvVar("inviteAdministratorEmail"), password: bru.getEnvVar("inviteAdministratorPassword") },
          validateStatus: () => true
        });
        if (actor.status !== 200) throw new Error("Invitation fixture login failed: " + actor.status);
        bru.setVar("invitationToken", actor.data.token);
        bru.setVar("invitationEmail", "bruno-invite-" + Date.now() + "@example.test");
    - type: tests
      code: |-
        test("Expected HTTP 201", () => expect(res.getStatus()).to.equal(201));
        test("Pending role is assigned", () => {
          const user = res.getBody();
          expect(user.status).to.equal("PENDING_REGISTRATION");
          expect(user.roles).to.deep.equal(["EMPLOYEE"]);
          expect(user).not.to.have.property("passwordHash");
        });
