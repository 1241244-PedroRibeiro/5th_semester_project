info:
  name: 03 - Customer cannot invite
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/auth/invite'
  auth:
    type: bearer
    token: '{{invitationToken}}'
  body:
    type: json
    data: |-
      {"email": "{{invitationEmail}}", "roleName": "EMPLOYEE"}
runtime:
  scripts:
    - type: before-request
      code: |-
        const actor = await bru.sendRequest({
          method: "POST", url: bru.getEnvVar("baseUrl") + "/auth/login",
          headers: { "Content-Type": "application/json" },
          data: { email: bru.getEnvVar("inviteCustomerEmail"), password: bru.getEnvVar("inviteCustomerPassword") },
          validateStatus: () => true
        });
        if (actor.status !== 200) throw new Error("Invitation fixture login failed: " + actor.status);
        bru.setVar("invitationToken", actor.data.token);
        bru.setVar("invitationEmail", "bruno-denied-" + Date.now() + "@example.test");
    - type: tests
      code: |-
        test("Expected HTTP 403", () => expect(res.getStatus()).to.equal(403));
