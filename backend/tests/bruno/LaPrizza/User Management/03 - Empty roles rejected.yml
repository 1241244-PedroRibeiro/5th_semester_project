info:
  name: 03 - Empty roles rejected
  type: http
  seq: 3
http:
  method: PUT
  url: '{{baseUrl}}/user/{{managementUsername}}/roles'
  auth:
    type: bearer
    token: '{{managementToken}}'
  body:
    type: json
    data: |-
      {"roles": []}
runtime:
  scripts:
    - type: before-request
      code: |-
        const login = await bru.sendRequest({
          method: "POST", url: bru.getEnvVar("baseUrl") + "/auth/login",
          headers: { "Content-Type": "application/json" },
          data: { email: bru.getEnvVar("managementAdministratorEmail"), password: bru.getEnvVar("managementAdministratorPassword") },
          validateStatus: () => true
        });
        if (login.status !== 200) throw new Error("Fixture login failed: " + login.status);
        if (login.data.user.username === bru.getEnvVar("managementUsername")) throw new Error("Use a separate disposable target account");
        bru.setVar("managementToken", login.data.token);
    - type: tests
      code: |-
        test("Expected HTTP 400", () => expect(res.getStatus()).to.equal(400));
