# laprizza SYS05 - Time-based access control for SSH
# Format: service;ttys;users;times
# Al = all days (Monday through Sunday), 0800-2200 (08:00-22:00 local time)
# Timezone: Europe/Lisbon (WET/WEST)

sshd;*;laprizza-admin-eduardo|laprizza-admin-pedro|laprizza-admin-mota|laprizza-admin-gustavo;Al0800-2200
