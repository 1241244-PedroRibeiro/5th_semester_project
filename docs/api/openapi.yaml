/kitchen-configurations/{id}/activate:
  post:
    tags: [Kitchen Configurations]
    summary: Activate a configuration (single-active invariant)
    description: |
      Executes UPDATE is_active = FALSE for all rows, then
      UPDATE is_active = TRUE for {name}, inside one transaction.
      The partial unique index uq_active_kitchen_configuration
      guarantees at most one active row at the DB layer (ADR-011,
      §18.3). Operation is idempotent.
    operationId: activateKitchenConfiguration
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Unique kitchen configuration UUID.
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Configuration activated.
        content:
          application/json:
            schema:
