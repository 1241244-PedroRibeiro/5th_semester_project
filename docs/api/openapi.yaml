# =========================================================================
# COMPONENTS
# =========================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer JWT issued by the implemented /auth/login and /auth/register.
        Claims: sid (UUID session ID), sub (username), email, roles[], status,
        iat, exp (15 minutes). Protected requests require an unrevoked,
        unexpired PostgreSQL session belonging to sub. Guards also re-read
        current roles and status. Tokens without sid require a new login (ADR-004.2).

  parameters:
    EntityId:
      name: id
      in: path
      required: true
      description: |
        Generic entity identifier (string). Retained for Sprint 1
        compatibility where callers may use "id" in the path.
      schema:
        type: string
    UsernameParam:
      name: username
      in: path
      required: true
      description: Business key for a User (VARCHAR(30)).
      schema:
        type: string
        minLength: 1
        maxLength: 30
        example: manager.01
    EmailParam:
      name: email
      in: path
      required: true
      description: Business key for a Customer (VARCHAR(255)).
      schema:
        type: string
        format: email
        example: maria.silva@email.pt
    SkuPathParam:
      name: sku
      in: path
      required: true
      description: Business key for a Product (VARCHAR(30)).
      schema:
        type: string
        minLength: 1
        maxLength: 30
        example: PRD-MOZZ-01
    NamePathParam:
      name: name
      in: path
      required: true
      description: |
        Business key (VARCHAR) for Category / Allergen / PizzaSize /
        ComponentType / KitchenConfiguration / ConsumptionForecast /
        SupplierScenario. Matches DB PRIMARY KEY 'name'.
      schema:
        type: string
        minLength: 1
        maxLength: 150
        example: 'Pizzas'
    NameOrCodePathParam:
      name: name
      in: path
      required: true
      description: |
        Business key that accepts either the canonical 'name' (Sprint 2)
        or the legacy 'code'/'id' (Sprint 1). The server resolves both.
      schema:
        type: string
        minLength: 1
        maxLength: 150
    NameOrIdPathParam:
      name: name
      in: path
      required: true
      description: |
        Business key that accepts either the canonical 'name' (Sprint 2)
        or the legacy 'id' (Sprint 1, e.g., 'SIZE-MED'). The server
        resolves both.
      schema:
        type: string
        minLength: 1
        maxLength: 150
    ProductCodeParam:
      name: productCode
      in: path
      required: true
      description: |
        Sprint 1 alias for product SKU (Sprint 2). Same identifier space.
      schema:
        type: string
        minLength: 1
        maxLength: 30
    UserRoleParam:
      name: role
      in: path
      required: true
      schema:
        type: string
        enum: [MANAGER, EMPLOYEE, CUSTOMER]
    ExecutionIdParam:
      name: executionId
      in: path
      required: true
      description: SERIAL primary key of planning_results.
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageStartIndex:
      name: pageStartIndex
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    400BadRequest:
      description: Structural/syntax validation failed on input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'
    401Unauthorized:
      description: Credentials missing, invalid, or expired.
      headers:
        WWW-Authenticate:
          description: |
            RFC 7235 §4.1 mandates that 401 responses advertise the
            authentication scheme. Bearer with realm is the standard form
            for JWT-based APIs.
          schema:
            type: string
            example: 'Bearer realm="laprizza"'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'
    403Forbidden:
      description: Insufficient role or account not ACTIVE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'
    404NotFound:
      description: Target entity not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'
    409Conflict:
      description: Duplicate unique constraint or referential block.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'
    422Unprocessable:
      description: Business domain invariant violated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'
    502BadGateway:
      description: Upstream unavailable (Prolog engine, IdP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'
    503ServiceUnavailable:
      description: Service in maintenance or dependency unavailable (SMTP, IdP).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

  schemas:
    PasswordRecoveryRequestDTO:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordRecoveryResetDTO:
      type: object
      additionalProperties: false
      required: [recovery_code, new_password]
      properties:
        recovery_code:
          type: string
          writeOnly: true
          description: Complete emailed 64-character hexadecimal code.
          pattern: '^[a-fA-F0-9]{64}$'
        new_password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
          description: Must contain uppercase, lowercase, a number, and a symbol.
    PasswordRecoveryConfirmationDTO:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ------------------------------------------------------------------
    # Common
    # ------------------------------------------------------------------
    ErrorResponseDTO:
      type: object
      required: [timestamp, status, error, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 409
        error:
          type: string
          example: Conflict
        message:
          type: string
          example: "Cannot delete category 'Pizzas': actively referenced by 3 products."
        details:
          type: array
          items:
            type: string
          example: ["Field 'email' must be a valid email address"]

    MoneyDTO:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          example: 9.50
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR

    # ------------------------------------------------------------------
    # Authentication
    # ------------------------------------------------------------------
    LoginRequestDTO:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponseDTO:
      type: object
      required: [token, refreshToken, user]
      properties:
        token:
          type: string
          description: Signed bearer JWT with a persisted session ID (sid); expires in 15 minutes.
        refreshToken:
          type: string
          description: Opaque one-time token rotated on every refresh; never stored in plaintext.
        user:
          $ref: '#/components/schemas/UserResponseDTO'

    ExchangeCodeRequestDTO:
      type: object
      required: [code]
      properties:
        code:
          type: string
          format: uuid
          description: The short-lived exchange code received in the callback redirect.

    RefreshTokenRequestDTO:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 32

    RefreshTokenResponseDTO:
      type: object
      required: [token, refreshToken]
      properties:
        token:
          type: string
        refreshToken:
          type: string

    RegisterCustomerRequestDTO:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 75
        lastName:
          type: string
          minLength: 1
          maxLength: 75
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phoneNumber:
          type: string
          pattern: '^[0-9+ ]{9,15}$'
        dietaryRestrictions:
          type: array
          items:
            $ref: '#/components/schemas/DietaryRestrictionDTO'

    PreRegisterStaffRequestDTO:
      type: object
      required: [firstName, lastName, email, roleName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 75
        lastName:
          type: string
          minLength: 1
          maxLength: 75
        email:
          type: string
          format: email
        roleName:
          type: string
          enum: [ADMINISTRATOR, MANAGER, EMPLOYEE]

    ActivateInvitationRequestDTO:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 32
          description: Cryptographically secure invitation token.
        password:
          type: string
          minLength: 8

    ActivationResponseDTO:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Account activated successfully.

    InvitationInfoResponseDTO:
      type: object
      required: [purpose, maskedEmail, expiresAt, valid]
      properties:
        purpose:
          type: string
          enum: [LOCAL_ACCOUNT_ACTIVATION, EXTERNAL_IDP_MATCH]
        maskedEmail:
          type: string
          example: m***a@laprizza.com
        expiresAt:
          type: string
          format: date-time
        valid:
          type: boolean
          example: true

    # ------------------------------------------------------------------
    # Users
    # ------------------------------------------------------------------
    UserStatus:
      type: string
      enum: [ACTIVE, DEACTIVATED, PENDING_REGISTRATION]

    CreateUserRequestDTO:
      type: object
      required: [firstName, lastName, email, roles]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 75
        lastName:
          type: string
          minLength: 1
          maxLength: 75
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Optional if user authenticates via external IdP only.
          nullable: true
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [MANAGER, EMPLOYEE, CUSTOMER]

    ReplaceUserRolesRequestDTO:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [MANAGER, EMPLOYEE, CUSTOMER]
          description: |
            The complete new role set. Array semantics are "replace", not
            "merge". Include all desired roles explicitly.
          example: [MANAGER, EMPLOYEE]
        reason:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Optional free-text justification stored verbatim in
            role_change_logs.reason (Clarification #24 §1.4).

    UserResponseDTO:
      type: object
      required: [username, firstName, lastName, email, status, roles, createdAt, updatedAt]
      properties:
        username:
          type: string
          maxLength: 30
        firstName:
          type: string
          maxLength: 75
        lastName:
          type: string
          maxLength: 75
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          items:
            type: string
            enum: [MANAGER, EMPLOYEE, CUSTOMER]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hasLocalPassword:
          type: boolean
          description: True when password_hash IS NOT NULL (ADR-010).
        hasExternalIdp:
          type: boolean
          description: True when external_idp_subject IS NOT NULL (ADR-010).

    SelfServiceContactResponse:
      allOf:
        - $ref: '#/components/schemas/UserResponseDTO'
        - type: object
          properties:
            address:
              $ref: '#/components/schemas/DeliveryAddressDTO'
            phoneNumber:
              type: string
              pattern: '^[0-9+ ]{9,15}$'
              example: '+351912345678'

    PaginatedUsersDTO:
      type: object
      required: [items, total, pageSize, pageStartIndex]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponseDTO'
        total:
          type: integer
        pageSize:
          type: integer
        pageStartIndex:
          type: integer

    RoleChangeLogResponseDTO:
      type: object
      required: [actorUsername, targetUsername, previousRoles, newRoles, changedAt]
      properties:
        actorUsername:
          type: string
        targetUsername:
          type: string
        previousRoles:
          type: array
          items:
            type: string
        newRoles:
          type: array
          items:
            type: string
        reason:
          type: string
          nullable: true
        changedAt:
          type: string
          format: date-time

    PaginatedRoleChangeLogDTO:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleChangeLogResponseDTO'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    DeliveryAddressDTO:
      type: object
      required: [street, postalCode, city]
      properties:
        street:
          type: string
        postalCode:
          type: string
        city:
          type: string
        extraDetails:
          type: string
          nullable: true

    # ------------------------------------------------------------------
    # Customers
    # ------------------------------------------------------------------
    DietaryRestrictionDTO:
      type: object
      required: [allergenName]
      properties:
        allergenName:
          type: string
        allergenCode:
          type: string
          description: |
            Sprint 1 alias for allergenName. Accepts 'ALL-GLUTEN' etc.
            The server resolves either form.
        description:
          type: string
          nullable: true
        recordedAt:
          type: string
          format: date-time
          nullable: true

    DietaryRestrictionsDTO:
      type: object
      required: [restrictions]
      properties:
        restrictions:
          type: array
          items:
            $ref: '#/components/schemas/DietaryRestrictionDTO'

    CreateCustomerRequestDTO:
      type: object
      required: [firstName, lastName, phone, email]
      properties:
        firstName: { type: string, minLength: 2, maxLength: 75 }
        lastName: { type: string, minLength: 2, maxLength: 75 }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        email: { type: string, format: email, maxLength: 255 }
        username: { type: string, nullable: true, description: Optional matching User account username. }
        vatNumber: { type: string, nullable: true, maxLength: 20 }
        marketingConsent: { type: boolean, default: false }
        deliveryAddresses:
          type: array
          items: { $ref: '#/components/schemas/CustomerAddressInputDTO' }
        dietaryRestrictions:
          type: array
          items: { $ref: '#/components/schemas/CustomerDietaryRestrictionInputDTO' }

    UpdateCustomerRequestDTO:
      type: object
      required: [firstName, lastName, phone, email]
      properties:
        firstName: { type: string, minLength: 2, maxLength: 75 }
        lastName: { type: string, minLength: 2, maxLength: 75 }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        email: { type: string, format: email, maxLength: 255 }
        vatNumber: { type: string, nullable: true, maxLength: 20 }
        marketingConsent: { type: boolean }

    CustomerAddressInputDTO:
      type: object
      required: [street, postalCode, city]
      properties:
        street: { type: string, minLength: 1, maxLength: 255 }
        postalCode: { type: string, minLength: 1, maxLength: 20 }
        city: { type: string, minLength: 1, maxLength: 100 }
        extraDetails: { type: string, maxLength: 500, default: '' }
        isDefault: { type: boolean, default: false }

    CustomerDietaryRestrictionInputDTO:
      type: object
      required: [allergenId]
      properties:
        allergenId: { type: string, description: Canonical allergen name key from the catalogue. }
        description: { type: string, maxLength: 500, default: '' }

    CustomerDietaryRestrictionsInputDTO:
      type: object
      required: [dietaryRestrictions]
      properties:
        dietaryRestrictions:
          type: array
          items: { $ref: '#/components/schemas/CustomerDietaryRestrictionInputDTO' }

    CustomerPageDTO:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomerListItemDTO' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }

    CustomerListItemDTO:
      type: object
      required: [id, firstName, lastName, phone, email, vatNumber]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        vatNumber: { type: string, nullable: true }

    CustomerResponseDTO:
      type: object
      required: [id, username, firstName, lastName, phone, email, vatNumber, marketingConsent, consentTimestamp, addresses, dietaryRestrictions, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, nullable: true }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        vatNumber: { type: string, nullable: true }
        marketingConsent: { type: boolean }
        consentTimestamp: { type: string, format: date-time }
        addresses: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, street: { type: string }, postalCode: { type: string }, city: { type: string }, extraDetails: { type: string }, isDefault: { type: boolean } } } }
        dietaryRestrictions: { type: array, items: { type: object, properties: { allergenId: { type: string }, description: { type: string }, recordedAt: { type: string, format: date-time } } } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ------------------------------------------------------------------
    # Categories, Allergens, Products
    # ------------------------------------------------------------------
    CreateCategoryRequestDTO:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        categoryName:
          type: string
          maxLength: 100
          description: |
            Sprint 1 alias for name. At least one of name or categoryName
            must be supplied. If both are supplied, name takes precedence.
        description:
          type: string
          nullable: true
      anyOf:
        - required: [name]
        - required: [categoryName]

    UpdateCategoryRequestDTO:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1

    CategoryResponseDTO:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    CategoryPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponseDTO'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 0

    UnauthorizedAttemptDTO:
      type: object
      required: [id, timestamp, endpoint]
      properties:
        id:
          type: string
        user:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        endpoint:
          type: string

    UnauthorizedAttemptsPageDTO:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnauthorizedAttemptDTO'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 0

    CreatedCategoryResponseDTO:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100

    CreateAllergenRequestDTO:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 100
          description: |
            Sprint 1 alias for name. At least one of name or code must be
            supplied. If both are supplied, name takes precedence.
        description:
          type: string
          nullable: true
      anyOf:
        - required: [name]
        - required: [code]

    AllergenResponseDTO:
      type: object
      required: [name]
      properties:
        name:
          type: string
        code:
          type: string
          description: |
            Sprint 1 alias for name. Populated with the same value as name.
        description:
          type: string
          nullable: true

    CreateProductRequestDTO:
      type: object
      required: [sku, name, description, categoryName, isSellable, isPizzaComponent, isStockControlled]
      properties:
        sku:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 150
        description:
          type: string
        categoryName:
          type: string
        categoryCode:
          type: string
          description: |
            Sprint 1 alias for categoryName. If supplied without categoryName,
            becomes the category. If both are supplied, categoryName takes
            precedence.
        isSellable:
          type: boolean
        isPizzaComponent:
          type: boolean
        isStockControlled:
          type: boolean
        componentTypeName:
          type: string
          nullable: true
        componentTypeCode:
          type: string
          nullable: true
          description: Sprint 1 alias for componentTypeName.
        directSellingPrice:
          $ref: '#/components/schemas/MoneyDTO'
        stockUnitsPerSale:
          type: integer
          nullable: true
          minimum: 0
          description: Required when isStockControlled ∧ isSellable (Clarification #28 §2).
        allergens:
          type: array
          items:
            type: string

    UpdateProductRequestDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        categoryName:
          type: string
        categoryCode:
          type: string
          description: Sprint 1 alias for categoryName.
        directSellingPrice:
          $ref: '#/components/schemas/MoneyDTO'
        stockUnitsPerSale:
          type: integer
          nullable: true
        allergens:
          type: array
          items:
            type: string

    ProductResponseDTO:
      type: object
      required: [sku, name, description, categoryName, isSellable, isPizzaComponent, isStockControlled, active]
      properties:
        sku:
          type: string
        productCode:
          type: string
          description: |
            Sprint 1 alias for sku. Populated with the same value as sku.
        name:
          type: string
        description:
          type: string
        categoryName:
          type: string
        categoryCode:
          type: string
          description: |
            Sprint 1 alias for categoryName. Populated with the same value.
        isSellable:
          type: boolean
        isPizzaComponent:
          type: boolean
        isStockControlled:
          type: boolean
        componentTypeName:
          type: string
          nullable: true
        componentTypeCode:
          type: string
          nullable: true
          description: Sprint 1 alias for componentTypeName.
        directSellingPrice:
          $ref: '#/components/schemas/MoneyDTO'
        stockUnitsPerSale:
          type: integer
          nullable: true
        isActive:
          type: boolean
        allergens:
          type: array
          items:
            type: string

    ProductExportDTO:
      type: object
      description: Full product catalogue export for AI06 Prolog KB construction.
      required: [exportedAt, products, boms, componentSizeConfigurations]
      properties:
        exportedAt:
          type: string
          format: date-time
        products:
          type: array
          items:
            type: object
            required: [sku, name, categoryName, isSellable, isPizzaComponent, isStockControlled, currentStock, isActive]
            properties:
              sku:
                type: string
              name:
                type: string
              categoryName:
                type: string
              isSellable:
                type: boolean
              isPizzaComponent:
                type: boolean
              isStockControlled:
                type: boolean
              componentTypeName:
                type: string
                nullable: true
              stockUnitsPerSale:
                type: integer
                nullable: true
              currentStock:
                type: integer
        boms:
          type: array
          items:
            type: object
            required: [pizzaSku, recipeName, availableSizes, lines]
            properties:
              pizzaSku:
                type: string
              recipeName:
                type: string
              availableSizes:
                type: array
                items:
                  type: string
              lines:
                type: array
                items:
                  type: object
                  required: [componentSku, defaultQuantity]
                  properties:
                    componentSku:
                      type: string
                    defaultQuantity:
                      type: integer
        componentSizeConfigurations:
          type: array
          items:
            type: object
            required: [componentSku, pizzaSize, stockUnitsConsumed]
            properties:
              componentSku:
                type: string
              pizzaSize:
                type: string
              stockUnitsConsumed:
                type: integer

    # ------------------------------------------------------------------
    # Pizza Taxonomy
    # ------------------------------------------------------------------
    CreatePizzaSizeRequestDTO:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          description: Business identifier (PK in pizza_sizes).
        id:
          type: string
          maxLength: 50
          description: |
            Sprint 1 alias for name. If supplied without name, becomes the
            business identifier. If both are supplied, name takes precedence.
      anyOf:
        - required: [name]
        - required: [id]

    PizzaSizeResponseDTO:
      type: object
      required: [name, active]
      properties:
        name:
          type: string
        id:
          type: string
          description: |
            Sprint 1 alias for name. Populated with the same value as name.
        active:
          type: boolean

    CreateComponentTypeRequestDTO:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 100
          description: |
            Sprint 1 alias for name. If supplied without name, becomes the
            identifier. If both are supplied, name takes precedence.
        assemblyOrder:
          type: integer
          minimum: 1
        minimum:
          type: integer
          minimum: 0
        maximum:
          type: integer
          nullable: true
          description: Null = unbounded.
      anyOf:
        - required: [name]
        - required: [code]

    ComponentTypeResponseDTO:
      type: object
      required: [name, assemblyOrder, minimum]
      properties:
        name:
          type: string
        code:
          type: string
          description: |
            Sprint 1 alias for name. Populated with the same value as name.
        assemblyOrder:
          type: integer
        minimum:
          type: integer
        maximum:
          type: integer
          nullable: true

    # ------------------------------------------------------------------
    # Size Configurations
    # ------------------------------------------------------------------
    CreateSizeConfigRequestDTO:
      type: object
      required: [applicablePrice, stockUnitsConsumed]
      properties:
        pizzaSize:
          type: string
        pizzaSizeId:
          type: string
          description: |
            Sprint 1 alias for pizzaSize. At least one of pizzaSize or
            pizzaSizeId must be supplied. If both are supplied, pizzaSize
            takes precedence.
        applicablePrice:
          $ref: '#/components/schemas/MoneyDTO'
        stockUnitsConsumed:
          type: integer
          minimum: 0
      anyOf:
        - required: [pizzaSize]
        - required: [pizzaSizeId]

    SizeConfigResponseDTO:
      type: object
      required: [componentSku, pizzaSize, applicablePrice, stockUnitsConsumed]
      properties:
        componentSku:
          type: string
        componentProductCode:
          type: string
          description: |
            Sprint 1 alias for componentSku. Populated with the same value.
        pizzaSize:
          type: string
        pizzaSizeId:
          type: string
          description: |
            Sprint 1 alias for pizzaSize. Populated with the same value.
        applicablePrice:
          $ref: '#/components/schemas/MoneyDTO'
        stockUnitsConsumed:
          type: integer

    # ------------------------------------------------------------------
    # Stock
    # ------------------------------------------------------------------
    StockAdjustmentRequestDTO:
      type: object
      required: [operation, units]
      properties:
        operation:
          type: string
          enum: [REPLENISH, CONSUME]
        units:
          type: integer
          minimum: 1
        reason:
          type: string
          nullable: true

    StockItemResponseDTO:
      type: object
      required: [productSku, currentBalance]
      properties:
        productSku:
          type: string
        productCode:
          type: string
          description: |
            Sprint 1 alias for productSku. Populated with the same value.
        currentBalance:
          type: integer
          minimum: 0

    # ------------------------------------------------------------------
    # Predefined Pizzas
    # ------------------------------------------------------------------
    RecipeLineDTO:
      type: object
      required: [componentSku, defaultQuantity]
      properties:
        componentSku:
          type: string
        componentProductCode:
          type: string
          description: |
            Sprint 1 alias for componentSku. Populated with the same value.
        defaultQuantity:
          type: integer
          minimum: 1

    UpdatePredefinedPizzaRequestDTO:
      type: object
      required: [recipeName, defaultRecipeLines]
      properties:
        recipeName:
          type: string
          minLength: 1
          maxLength: 100
        defaultRecipeLines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeLineDTO'
        availableSizes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: |
            Sprint 1 alias for availableSizeNames. At least one of
            availableSizes or availableSizeNames must be supplied. If
            both are supplied, availableSizeNames takes precedence.
        availableSizeNames:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
      anyOf:
        - required: [availableSizes]
        - required: [availableSizeNames]

    CreatePredefinedPizzaRequestDTO:
      type: object
      required: [recipeName, defaultRecipeLines]
      properties:
        sellableProductSku:
          type: string
          description: SKU of the sellable product (Sprint 2 canonical).
        pizzaSku:
          type: string
          description: |
            Sprint 1 alias for sellableProductSku. If supplied without
            sellableProductSku, becomes the SKU. If both are supplied,
            sellableProductSku takes precedence.
        recipeName:
          type: string
          minLength: 1
          maxLength: 100
        defaultRecipeLines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeLineDTO'
        availableSizeNames:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: Sprint 2 canonical field name.
        availableSizes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: |
            Sprint 1 alias for availableSizeNames. At least one of
            availableSizeNames or availableSizes must be supplied. If
            both are supplied, availableSizeNames takes precedence.
      allOf:
        - anyOf:
            - required: [sellableProductSku]
            - required: [pizzaSku]
        - anyOf:
            - required: [availableSizeNames]
            - required: [availableSizes]

    PredefinedPizzaResponseDTO:
      type: object
      required: [sku, recipeName, defaultRecipeLines, availableSizeNames]
      properties:
        sku:
          type: string
        pizzaSku:
          type: string
          description: |
            Sprint 1 alias for sku. Populated with the same value as sku.
        recipeName:
          type: string
        defaultRecipeLines:
          type: array
          items:
            $ref: '#/components/schemas/RecipeLineDTO'
        availableSizeNames:
          type: array
          items:
            type: string
        supportedSizes:
          type: array
          items:
            type: string
          description: |
            Sprint 1 alias for availableSizeNames. Populated with the same
            values as availableSizeNames.
        ids:
          type: array
          description: |
            Sprint 1 derived view: one entry per (sku, sizeName) variant.
            Populated by expanding availableSizeNames.
          items:
            type: object
            required: [pizzaSku, pizzaSize]
            properties:
              pizzaSku:
                type: string
              pizzaSize:
                type: string

    # ------------------------------------------------------------------
    # Catalogue
    # ------------------------------------------------------------------
    CatalogueItemResponseDTO:
      type: object
      required: [productSku, name, categoryName, allergens, isPredefinedPizza, isAvailable]
      properties:
        productSku:
          type: string
        productCode:
          type: string
          description: |
            Sprint 1 alias for productSku. Populated with the same value.
        name:
          type: string
        description:
          type: string
        categoryName:
          type: string
        categoryCode:
          type: string
          description: |
            Sprint 1 alias for categoryName. Populated with the same value.
        allergens:
          type: array
          items:
            type: string
        directPrice:
          $ref: '#/components/schemas/MoneyDTO'
        isPredefinedPizza:
          type: boolean
        isAvailable:
          type: boolean
        recipeName:
          type: string
          nullable: true
        defaultRecipeLines:
          type: array
          items:
            $ref: '#/components/schemas/RecipeLineDTO'
        sizeVariants:
          type: array
          items:
            type: object
            required: [sizeName, computedPrice, isAvailable]
            properties:
              sizeId:
                type: string
                format: uuid
                nullable: true
                description: |
                  Database identifier (Sprint 1 contract; may be null when
                  the implementation uses size name only).
              sizeName:
                type: string
              computedPrice:
                $ref: '#/components/schemas/MoneyDTO'
              isAvailable:
                type: boolean

    # ------------------------------------------------------------------
    # Kitchen Configurations
    # ------------------------------------------------------------------
    CreateKitchenConfigurationDTO:
      type: object
      required: [name, jsonContent]
      properties:
        name:
          type: string
        jsonContent:
          type: object
          description: |
            Opaque layout validated against the kitchen configuration schema.
          additionalProperties: true

    UpdateKitchenConfigurationDTO:
      type: object
      required: [name, jsonContent]
      properties:
        name:
          type: string
          maxLength: 100
          description: Unique descriptive configuration name.
        jsonContent:
          type: object
          additionalProperties: true
    KitchenConfigurationResponseDTO:
      type: object
      required: [id, name, jsonContent, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Immutable technical identifier.
        name:
          type: string
          maxLength: 100
          description: Unique descriptive configuration name.
        jsonContent:
          type: object
          additionalProperties: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # Consumption Forecasts
    # ------------------------------------------------------------------
    ForecastEntryDTO:
      type: object
      required: [entryDate, productSku, pizzaSize, quantity]
      properties:
        entryDate:
          type: string
          format: date
        productSku:
          type: string
        productCode:
          type: string
          description: Sprint 1 alias for productSku.
        pizzaSize:
          type: string
          nullable: true
          description: |
            Null for non-pizza products (Clarification #28).
        quantity:
          type: integer
          minimum: 0

    ConsumptionForecastRequestDTO:
      type: object
      required: [name, startDate, endDate, entries]
      properties:
        name:
          type: string
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ForecastEntryDTO'

    ConsumptionForecastResponseDTO:
      type: object
      required: [name, startDate, endDate, entries]
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ForecastEntryDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # Supplier Scenarios
    # ------------------------------------------------------------------
    SupplierOfferDTO:
      type: object
      required: [supplierCode, productSku, price, stockUnitQuantity, leadTimeDays]
      properties:
        supplierCode:
          type: string
          maxLength: 30
        productSku:
          type: string
        productCode:
          type: string
          description: Sprint 1 alias for productSku.
        price:
          $ref: '#/components/schemas/MoneyDTO'
        stockUnitQuantity:
          type: integer
          minimum: 1
        leadTimeDays:
          type: integer
          minimum: 0
          description: Whole days (Clarification #28 §4).
        dailySupplyLimit:
          type: integer
          nullable: true
          minimum: 0
          description: |
            Applies per-offer per-day. Null = unlimited. 0 = never
            supplies (distinct from unlimited, per Clarification #28).

    SupplierDTO:
      type: object
      required: [supplierCode, name]
      properties:
        supplierCode:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 150

    SupplierScenarioRequestDTO:
      type: object
      required: [name, suppliers, offers]
      properties:
        name:
          type: string
          maxLength: 100
        isSimulated:
          type: boolean
          default: false
          description: True if LLM-assisted or manually simulated.
        suppliers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SupplierDTO'
        offers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SupplierOfferDTO'

    SupplierScenarioResponseDTO:
      type: object
      required: [name, isSimulated, suppliers, offers]
      properties:
        name:
          type: string
        isSimulated:
          type: boolean
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        suppliers:
          type: array
          items:
            $ref: '#/components/schemas/SupplierDTO'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/SupplierOfferDTO'

    # ------------------------------------------------------------------
    # Planning
    # ------------------------------------------------------------------
    BomOrderDTO:
      type: object
      required: [productSku, quantity]
      properties:
        productSku:
          type: string
          example: "PRD-PIZZA-MARG"
        pizzaSize:
          type: string
          description: Required for pizza orders; omitted for directly sold stock-controlled products.
          example: "Medium"
        quantity:
          type: integer
          minimum: 1
          example: 12

    BomExecutionRequestDTO:
      type: object
      required: [orders, isSimulated, source]
      properties:
        orders:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BomOrderDTO'
        scenarioName:
          type: string
          nullable: true
        referenceDate:
          type: string
          format: date
          nullable: true
        isSimulated:
          type: boolean
          example: true
        source:
          type: string
          enum: [simulated, fromForecast]
          example: "simulated"

    PlanningExecutionRequestDTO:
      type: object
      required: [forecastName, scenarioName]
      properties:
        forecastName:
          type: string
        scenarioName:
          type: string
        referenceDate:
          type: string
          format: date
          nullable: true
          description: Defaults to today when omitted.
        pendingDeliveries:
          type: array
          description: Deliveries expected to become available on their expected delivery date.
          items:
            type: object
            required: [productSku, quantity, expectedDeliveryDate]
            properties:
              productSku:
                type: string
              quantity:
                type: integer
                minimum: 1
              expectedDeliveryDate:
                type: string
                format: date

    PlanningRequirementDTO:
      type: object
      required: [productSku, requiredUnits, availableUnits, hypotheticalRemainingUnits, replenishmentUnits]
      properties:
        productSku:
          type: string
        requiredUnits:
          type: integer
        availableUnits:
          type: integer
        hypotheticalRemainingUnits:
          type: integer
          description: Always >= 0. Never represents a negative shortfall (which is shown in replenishmentUnits).
        replenishmentUnits:
          type: integer

    PurchaseProposalDTO:
      type: object
      required: [supplierCode, productSku, quantity, orderDate, expectedDelivery]
      properties:
        supplierCode:
          type: string
        productSku:
          type: string
        quantity:
          type: integer
        orderDate:
          type: string
          format: date
        expectedDelivery:
          type: string
          format: date

    UnmetNeedDTO:
      type: object
      required: [productSku, requiredUnits, shortfallUnits, reason]
      properties:
        productSku:
          type: string
        requiredUnits:
          type: integer
        shortfallUnits:
          type: integer
        reason:
          type: string

    PlanningResultResponseDTO:
      type: object
      required: [executionId, referenceDate, isReplay, isSimulated, executedAt, requirements, proposals, unmetNeeds]
      properties:
        executionId:
          type: integer
        forecastName:
          type: string
          nullable: true
        scenarioName:
          type: string
          nullable: true
        referenceDate:
          type: string
          format: date
        isReplay:
          type: boolean
        isSimulated:
          type: boolean
        executedAt:
          type: string
          format: date-time
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/PlanningRequirementDTO'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseProposalDTO'
        unmetNeeds:
          type: array
          items:
            $ref: '#/components/schemas/UnmetNeedDTO'
