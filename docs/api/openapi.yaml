# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2021-09-28
openapi: 3.0.3
info:
  title: LaPrizza Information System — Back-End REST API
  description: |
    Formal OpenAPI 3.0.3 machine-readable contract for the LaPrizza REST API
    (Modular Monolith — NestJS + PostgreSQL 16). This is the MERGED contract
    combining Sprint 1 (BCK01–BCK11 baseline) and Sprint 2 baseline.

    Sprint 2 architectural decisions bound by this contract:
      • Clean/Onion + Hexagonal Ports & Adapters (ADR-001).
      • Business Keys as PK/FK (authentication sessions use UUIDs) — username, email, sku, name, supplier_code (§16.2).
      • JWT (RFC 7519) with PostgreSQL session revocation, Argon2id and proposed OIDC (ADR-004, ADR-004.2, ADR-010).
      • Richardson Level 2 (ADR-005).
      • Prolog AI engine invoked over HTTP/REST only (ADR-012).
      • PlanningResult is strictly read-only with deep snapshots (ADR-013).
      • KitchenConfiguration is opaque JSONB with single-active partial unique index (ADR-011).
      • 3D assets delivered as GLB (ADR-014) and referenced by the active configuration.

    Authenticated requests rejected with HTTP 403 are audited in PostgreSQL
    with the verified username, database timestamp, and HTTP method/route pattern
    (ADR-015). Anonymous/invalid-token 401 responses are excluded. Audit failures
    preserve the forbidden response. Query strings and request contents are not logged.

    Backward compatibility with Sprint 1:
      • Self-service user endpoints (/user/me/*) preserved as documented.
      • /categories is a functional alias of /product-categories.
      • Sprint 1 field names (productCode, categoryCode, code, id, availableSizes, pizzaSku)
        are accepted as optional aliases alongside Sprint 2 canonical names.

    Error envelope is uniform:
      { timestamp, status, error, message, details? }
  version: 2.2.0
  contact:
    name: LEI Integrative Project — 5th Semester (Team 3DJ-05)
    email: support@laprizza.local
  license:
    name: Academic Prototype — ISEP LEI 2026/2027

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development (Node.js / NestJS)
  - url: https://api.laprizza.local/api/v1
    description: Staging / Testing (Nginx reverse-proxied)

tags:
  - name: Diagnostics
    description: Liveness and readiness probes (SYS02).
  - name: Authentication
    description: Local credentials, external OIDC, activation flow (AA01, AA02, AA06, AA07).
  - name: Users
    description: User provisioning, lifecycle, role administration, audit and self-service (BCK01, AA06).
  - name: Customers
    description: Commercial customer profiles and dietary restrictions (BCK02).
  - name: Product Categories
    description: Catalogue taxonomy (BCK03). Served under both /product-categories and /categories.
  - name: Allergens
    description: EU-14 seed catalogue (BCK04).
  - name: Products
    description: Master catalogue, product types, and export for planning KB (BCK05, AI06).
  - name: Pizza Taxonomy
    description: Sizes and component types (BCK06, BCK07).
  - name: Component Configurations
    description: Per-size price and abstract stock consumption (BCK08).
  - name: Stock
    description: Abstract integer stock with pessimistic locking (BCK09, ADR-008b).
  - name: Predefined Pizzas
    description: Recipes and dynamic component-derived pricing (BCK10).
  - name: Catalogue Query
    description: Composite read model for public catalogue (BCK11).
  - name: Item Pictures
    description: Product and predefined-pizza pictures stored in the laprizza-pictures volume (ADR-018, ADR-005.2).
  - name: Kitchen Configurations
    description: Opaque JSONB layouts with single-active invariant (WEB06, ADR-011).
  - name: Consumption Forecasts
    description: Aggregate-root daily consumption forecasts (WEB07).
  - name: Supplier Scenarios
    description: Aggregate-root confirmed supplier scenarios (WEB07).
  - name: AI Planning
    description: BOM + Requirements Planning orchestrated through Prolog (AI01, AI02, AI05, AI06).
  - name: Shared Documents
    description: Authenticated operational documents and project reports (SYS04).

paths:

  # =========================================================================
  # 0. DIAGNOSTICS
  # =========================================================================
  /health:
    get:
      tags: [Diagnostics]
      summary: Liveness/readiness probe
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service operational.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, down]
                    example: ok
                  version:
                    type: string
                    example: '2.0.0'
                  timestamp:
                    type: string
                    format: date-time
                  dependencies:
                    type: object
                    properties:
                      postgres:
                        type: string
                        enum: [up, down]
                      prolog:
                        type: string
                        enum: [up, down, unconfigured]
                      idp:
                        type: string
                        enum: [up, down, unconfigured]
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  # =========================================================================
  # 1. AUTHENTICATION (BCK01, AA01, AA02, AA06, AA07)
  # =========================================================================
  /password-recovery:
    post:
      tags: [Authentication]
      summary: Email a password recovery code for an active account
      operationId: requestPasswordRecovery
      security: []
      description: |
        Public for all roles, including users without a current login.
        Sends a one-use 5-minute code from laprizzag05@gmail.com, stores its
        SHA-256 digest as PENDING, and enforces a 30-minute cooldown even after use.
        A failed SMTP submission rolls back the record. Codes are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequestDTO'
      responses:
        '200':
          description: Recovery email submitted. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryConfirmationDTO'
        '400':
          description: Invalid email or body fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: No registered ACTIVE account for this email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '429':
          description: A code was requested within the last 30 minutes.
          headers:
            Retry-After:
              description: Seconds until another request is allowed.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '503':
          description: SMTP is unconfigured or email submission failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /password-recovery/new_pass:
    post:
      tags: [Authentication]
      summary: Consume a recovery code and update the password
      operationId: resetRecoveredPassword
      security: []
      description: |
        Requires an ACTIVE account and a PENDING, unexpired code.
        Atomically updates the Argon2id password hash, marks the code USED,
        and revokes all existing sessions for the recovered account.
        Codes expire exactly five minutes after generation. No automatic login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryResetDTO'
      responses:
        '200':
          description: Password updated. Sign in again. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryConfirmationDTO'
        '400':
          description: Malformed code, weak password, or invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unknown recovery code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: The account is no longer ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '409':
          description: Recovery code has already been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '410':
          description: Recovery code has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate credentials; issue internal JWT
      description: |
        Authenticates an active local account, persists a new session, and returns
        a bearer JWT with sid, sub, email, roles, status, iat, and exp (15 minutes).
        Returns the same 401 for unknown-email and wrong-password.
        Pending registration returns 400; deactivated accounts return 403.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
      responses:
        '200':
          description: Authentication successful; JWT issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Account DEACTIVATED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /auth/register:
    post:
      tags: [Authentication]
      summary: Public customer self-registration (AA07)
      description: |
        Creates an active CUSTOMER user or completes a pending registration.
        Persists a new authentication session and returns a bearer JWT and user summary.
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequestDTO'
      responses:
        '201':
          description: Registration complete; session persisted and JWT issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current authenticated session
      description: |
        Revokes only the session identified by the authenticated JWT sid.
        Returns success only after PostgreSQL records revocation. Subsequent
        protected reads and writes with that credential return 401.
        Other login sessions remain active. Requests authenticated before
        revocation may finish. No role or active-account status is required.
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Current session revoked; no response body.
        '401':
          description: Missing, invalid, expired, unknown, or already revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '500':
          description: Session lookup or revocation failed; logout is not confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a persisted refresh token
      operationId: refreshAuthSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestDTO'
      responses:
        '200':
          description: New JWT and one-time refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /user/{username}/reactivate:
    post:
      tags: [Users]
      summary: Reactivate a deactivated account
      description: |
        ACTIVE ADMINISTRATOR only. Changes a DEACTIVATED target to ACTIVE without
        changing roles or password. Rejects ACTIVE and PENDING_REGISTRATION targets.
        Does not issue a session or restore expired/revoked sessions.
      operationId: reactivateUser
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Account reactivated.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /user/{username}/roles:
    put:
      tags: [Users]
      summary: Replace a user's assigned roles
      description: |
        ACTIVE ADMINISTRATOR only. Accepts the full desired nonempty role list;
        add multiple roles or omit existing roles to remove them. Duplicates are
        collapsed. Preserves account status; pending invitations remain pending.
        DEACTIVATED targets return 409 and require reactivation first.
        The acting administrator must retain their own ADMINISTRATOR
        role. Subsequent protected requests read current roles from the database.
      operationId: setUserRoles
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [ADMINISTRATOR, MANAGER, EMPLOYEE, CUSTOMER]
      responses:
        '200':
          description: Roles persisted; updated public user summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
        '404':
          $ref: '#/components/responses/404NotFound'

  /auth/invite:
    post:
      tags: [Authentication]
      summary: Invite a user or replace the role of a pending invitation
      description: |
        ACTIVE ADMINISTRATOR or MANAGER only. Creates a PENDING_REGISTRATION
        account with the selected role, or replaces the role of an existing pending
        account. Registered/deactivated accounts return 409. Sends instructions from
        laprizzag05@gmail.com to use the normal Register button with the same email.
        Normal registration sets the person's own name and password and retains the
        latest invited role. SMTP failure returns 503; the pending invitation remains
        saved and can be retried. No invitation token or additional table is used.
      operationId: inviteUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roleName]
              properties:
                email:
                  type: string
                  format: email
                roleName:
                  type: string
                  enum: [ADMINISTRATOR, MANAGER, EMPLOYEE, CUSTOMER]
      responses:
        '201':
          description: Pending invitation saved and email accepted by SMTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /auth/pre_register:
    post:
      tags: [Authentication]
      summary: Administrator pre-registers staff (legacy flow)
      description: |
        ACTIVE ADMINISTRATOR only. Creates a PENDING_REGISTRATION account
        with one staff role. Duplicate email returns 409. This legacy endpoint
        does not send email; use /auth/invite for emailed, updateable invitations.
      operationId: preRegisterStaff
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreRegisterStaffRequestDTO'
      responses:
        '201':
          description: Staff pre-registered; no email dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /auth/external/login:
    get:
      tags: [Authentication]
      summary: Initiate OIDC Authorization Code + PKCE (AA02)
      description: |
        Generates state, nonce and PKCE code_verifier, stores them in the
        server-side session (short-lived), and 302-redirects the browser
        to the configured external IdP. The client_secret never leaves
        the backend (ADR-010).
      operationId: initiateExternalLogin
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
            example: /kitchen
      responses:
        '302':
          description: Redirect to the external IdP authorization endpoint.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /auth/external/callback:
    get:
      tags: [Authentication]
      summary: OIDC callback; JIT-provision if new; issue JWT (AA02)
      description: |
        Validates ID Token (issuer, audience, signature, exp, nonce),
        extracts sub → external_idp_subject. JIT provision per
        Clarification #27: creates User (ACTIVE, CUSTOMER, password_hash
        NULL, external_idp_subject set) + Customer. If an account exists
        with the same verified email but WITHOUT external_idp_subject,
        the login is rejected (prevents takeover).
      operationId: externalCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
            enum: [access_denied, invalid_request, server_error, temporarily_unavailable]
      responses:
        '302':
          description: Redirect to SPA with short-lived bootstrap token (state-validated).
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          description: Verified email collision without external_idp_subject; account-linking required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /auth/external/exchange:
    post:
      tags: [Authentication]
      summary: Exchange a short-lived code for an internal JWT (AA02)
      operationId: exchangeExternalCode
      security: []
      description: |
        Consumes a single-use, short-lived code obtained from the OIDC callback
        and issues the internal JWT. This prevents the JWT from appearing in
        the browser URL history or HTTP logs (AA04 security constraint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeCodeRequestDTO'
      responses:
        '200':
          description: Authentication successful; JWT issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
        '401':
          description: Invalid, expired, or already used exchange code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /auth/invitation/{token}:
    get:
      tags: [Authentication]
      summary: Inspect an account activation invitation (AA07)
      operationId: inspectActivationInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        '200':
          description: Valid invitation summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInfoResponseDTO'
        '404':
          $ref: '#/components/responses/404NotFound'
        '410':
          description: Invitation expired, revoked, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /auth/activate:
    post:
      tags: [Authentication]
      summary: Consume activation invitation; complete account setup (AA06, AA07)
      operationId: consumeActivationInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateInvitationRequestDTO'
      responses:
        '200':
          description: Invitation consumed; account ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          description: Invitation expired, revoked, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          $ref: '#/components/responses/422Unprocessable'

  # =========================================================================
  # 2. USERS & ROLES (BCK01 + AA06) + SELF-SERVICE (Sprint 1 preserved)
  # =========================================================================
  /admin/unauthorized-attempts:
    get:
      tags: [Administration]
      summary: List application authorization failures
      description: ACTIVE ADMINISTRATOR only. Infrastructure logs are outside this endpoint.
      operationId: listUnauthorizedAttempts
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated application authorization failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedAttemptsPageDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /users:
    get:
      tags: [Users]
      summary: List users (paginated)
      description: ACTIVE ADMINISTRATOR or MANAGER only; returns a paginated user list.
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageStartIndex'
      responses:
        '200':
          description: Paginated list of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
    post:
      tags: [Users]
      summary: Create a system user with designated roles (Manager only)
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequestDTO'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'

  /users/filter/creation-date/{date}:
    get:
      tags: [Users]
      summary: Filter users by registration date
      description: ACTIVE ADMINISTRATOR or MANAGER only; returns a paginated user list.
      operationId: filterUsersByCreationDate
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Users registered on the date.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /users/filter/role/{role}:
    get:
      tags: [Users]
      summary: Filter users by role
      description: ACTIVE ADMINISTRATOR or MANAGER only; returns a paginated user list.
      operationId: filterUsersByRole
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserRoleParam'
      responses:
        '200':
          description: Users holding the role.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /users/filter/status/{status}:
    get:
      tags: [Users]
      summary: Filter users by status
      description: ACTIVE ADMINISTRATOR or MANAGER only; returns a paginated user list.
      operationId: filterUsersByStatus
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: Users in the status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /user/{username}:
    get:
      tags: [Users]
      summary: Retrieve user by username
      operationId: getUserByUsername
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
      responses:
        '200':
          description: User record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags: [Users]
      summary: Deactivate user (Manager or self)
      description: |
        Sets status to DEACTIVATED. Referential integrity via
        ON DELETE CASCADE (roles, dietary, invitations) and
        ON DELETE SET NULL (customers.username).
      operationId: deactivateUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
      responses:
        '204':
          description: User deactivated.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Cannot deactivate the last active MANAGER.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /users/{username}/role-history:
    get:
      tags: [Users]
      summary: Read role-change audit trail (AA06)
      operationId: getUserRoleHistory
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
      responses:
        '200':
          description: Ordered list of role-change log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleChangeLogDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /users/{username}/roles:
    put:
      tags: [Users]
      summary: Replace a user's role set (AA06)
      description: |
        Manager-only. Replaces the user's entire role set. Emits a
        RoleChangeLog entry (Clarification #24 §1.4). Enforces ≥1 active
        MANAGER invariant (Clarification #24 §1.2). Takes immediate
        effect because JwtAuthGuard re-reads roles from the repository
        (ADR-004). If the new set includes CUSTOMER, an associated
        Customer record must exist or be atomically created
        (Clarification #27; 422 on missing mandatory data).
      operationId: replaceUserRoles
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceUserRolesRequestDTO'
      responses:
        '200':
          description: Roles replaced; RoleChangeLog entry persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Would leave zero active MANAGERs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: CUSTOMER role requires a valid Customer record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /user/me/address:
    put:
      tags: [Users]
      summary: Update own address (self-service)
      operationId: updateOwnAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAddressDTO'
      responses:
        '200':
          description: Address updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /user/me/phone-number:
    put:
      tags: [Users]
      summary: Update own phone number (self-service)
      operationId: updateOwnPhoneNumber
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
                  pattern: '^[0-9+ ]{9,15}$'
                  example: '+351912345678'
      responses:
        '200':
          description: Phone updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  # -------------------------------------------------------------------------
  # Sprint 1 self-service endpoints preserved
  # -------------------------------------------------------------------------
  /user/me/contact-details:
    get:
      tags: [Users]
      summary: Read the authenticated user's persisted contact details (Sprint 1)
      description: |
        Available to active customers, managers and employees. Identity is
        derived exclusively from the token. Address and phoneNumber are
        omitted when not set. Returns Cache-Control no-store.
      operationId: getOwnContactDetails
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Public identity + optional private contact fields.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfServiceContactResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Account is not ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          $ref: '#/components/responses/404NotFound'

  /user/me/name:
    put:
      tags: [Users]
      summary: Update the authenticated user's name (Sprint 1)
      description: |
        Active accounts of any role update only themselves. Identity from
        the token; body identifiers, roles and status are rejected.
      operationId: setOwnName
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [firstName, lastName]
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 75
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 75
      responses:
        '200':
          description: Updated user summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Inactive account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          $ref: '#/components/responses/404NotFound'

  /user/me/email:
    put:
      tags: [Users]
      summary: Update the authenticated user's email (Sprint 1)
      description: |
        Active accounts of any role update only themselves. Identity from
        the token; body identifiers, roles and status are rejected.
        Current password must be verified; incorrect password returns 403.
      operationId: setOwnEmail
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, currentPassword]
              properties:
                email:
                  type: string
                  format: email
                currentPassword:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
      responses:
        '200':
          description: Updated user summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Inactive account or incorrect current password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /user/me/password:
    put:
      tags: [Users]
      summary: Update the authenticated user's password (Sprint 1)
      description: |
        Active accounts of any role update only themselves. Identity from
        the token; body identifiers, roles and status are rejected.
        Current password must be verified; incorrect password returns 403.
      operationId: setOwnPassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                newPassword:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 8
                  description: |
                    Requires uppercase, lowercase, numeric and non-whitespace
                    special characters.
      responses:
        '200':
          description: Updated user summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Inactive account or incorrect current password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          $ref: '#/components/responses/404NotFound'

  # =========================================================================
  # 3. CUSTOMERS (BCK02)
  # =========================================================================
  /customers:
    post:
      tags: [Customers]
      summary: Register a new business customer (Manager)
      operationId: createCustomer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequestDTO'
      responses:
        '201':
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
    get:
      tags: [Customers]
      summary: Search customers
      operationId: listCustomers
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive substring match on first/last name, email, phone, or VAT number.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
      responses:
        '200':
          description: Matching customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPageDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Retrieve customer by UUID
      operationId: getCustomerById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Customer record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      tags: [Customers]
      summary: Update customer profile
      operationId: updateCustomer
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequestDTO'
      responses:
        '200':
          description: Customer updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags: [Customers]
      summary: Delete customer (Manager)
      description: |
        Deletion is prevented while historical orders reference the customer.
      operationId: deleteCustomer
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Customer deleted.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /customers/{id}/dietary-restrictions:
    put:
      tags: [Customers]
      summary: Replace commercial customer's dietary restrictions (Manager)
      operationId: replaceDietaryRestrictions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDietaryRestrictionsInputDTO'
      responses:
        '200':
          description: Restrictions replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /customers/{id}/user:
    put:
      tags: [Customers]
      summary: Link or unlink a matching User account (Manager)
      operationId: setCustomerUserLink
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, nullable: true }
      responses:
        '200':
          description: Customer link updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponseDTO' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthorized' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }
        '409': { $ref: '#/components/responses/409Conflict' }

  /customers/{id}/addresses:
    post:
      tags: [Customers]
      summary: Add a delivery address (Manager)
      operationId: addCustomerAddress
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerAddressInputDTO' }
      responses:
        '200':
          description: Customer with address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponseDTO' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthorized' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }

  /customers/{id}/addresses/{addressId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: addressId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Customers]
      summary: Update a delivery address (Manager)
      operationId: updateCustomerAddress
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerAddressInputDTO' }
      responses:
        '200':
          description: Customer with updated address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponseDTO' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthorized' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }
    delete:
      tags: [Customers]
      summary: Remove a delivery address (Manager)
      operationId: removeCustomerAddress
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Customer with address removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponseDTO' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthorized' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }

  /customers/{id}/addresses/{addressId}/default:
    put:
      tags: [Customers]
      summary: Set default delivery address (Manager)
      operationId: setDefaultCustomerAddress
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: addressId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Customer with selected default address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponseDTO' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthorized' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }

  # =========================================================================
  # 4. PRODUCT CATEGORIES (BCK03) — canonical /product-categories path
  # =========================================================================
  /product-categories:
    post:
      tags: [Product Categories]
      summary: Create product category
      operationId: createProductCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequestDTO'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
    get:
      tags: [Product Categories]
      summary: List/search product categories
      description: |
        When page/pageSize are omitted, returns a plain array (Sprint 2
        contract). When at least one is provided, returns a CategoryPage
        (Sprint 1 contract). Search is applied before pagination.
      operationId: listProductCategories
      security: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: |
            Plain array (pagination not requested) or CategoryPage (requested).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/CategoryResponseDTO'
                  - $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /product-categories/{name}:
    parameters:
      - $ref: '#/components/parameters/NamePathParam'
    get:
      tags: [Product Categories]
      summary: Read category by name
      operationId: getProductCategory
      security: []
      responses:
        '200':
          description: Category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      tags: [Product Categories]
      summary: Update category (Manager)
      description: |
        Original update contract (Sprint 1): both name and description
        required. Renaming a referenced category returns 400; duplicate
        names return 409.
      operationId: updateProductCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequestDTO'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
    delete:
      tags: [Product Categories]
      summary: Delete an unreferenced category (Manager)
      description: |
        ON DELETE RESTRICT at the DB layer guarantees BCK03 AC5. The
        service layer detects references upfront and returns 409 with
        details listing dependent product SKUs (Clarification #23 §1.2).
      operationId: deleteProductCategory
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Category deleted.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  # -------------------------------------------------------------------------
  # Sprint 1 alias path /categories (functional duplicate of /product-categories)
  # -------------------------------------------------------------------------
  /categories:
    get:
      tags: [Product Categories]
      summary: List/search product categories (Sprint 1 alias)
      description: |
        Functional alias of /product-categories. Same pagination and search
        semantics as the canonical path.
      operationId: listCategoriesAlias
      security: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Plain array or CategoryPage.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/CategoryResponseDTO'
                  - $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/400BadRequest'
    post:
      tags: [Product Categories]
      summary: Create product category (Sprint 1 alias)
      operationId: createCategoryAlias
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequestDTO'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDTO'
        '400':
