  /stock/{sku}:
    get:
      tags: [Stock]
      summary: Retrieve stock balance by SKU
      operationId: getStockBalance
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SkuPathParam'
      responses:
        '200':
          description: Stock balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /stock/{sku}/adjustments:
    post:
      tags: [Stock]
      summary: Atomic replenishment or consumption (pessimistic locking)
      description: |
        Uses SELECT ... FOR UPDATE inside a transaction (ADR-008b). If the
        operation would result in a negative balance, rolls back and
        returns 422 Unprocessable Entity.
      operationId: adjustStock
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SkuPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequestDTO'
      responses:
        '200':
          description: Balance after adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Concurrent conflict (optimistic path, future).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          $ref: '#/components/responses/422Unprocessable'

