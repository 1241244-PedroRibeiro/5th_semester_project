  /planning/executions/{executionId}/replay:
    post:
      tags: [AI Planning]
      summary: Replay a historical execution using its snapshots
      description: |
        Re-executes BOM/Requirements Planning using the original snapshots
        (forecast_snapshot, scenario_snapshot, stock_snapshot) rather than
        current data. Creates a new PlanningResult with is_replay = true
        (ADR-013). Original result untouched.
      operationId: replayPlanningExecution
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExecutionIdParam'
      responses:
        '201':
          description: Replay executed; new PlanningResult persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningResultResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '502':
          $ref: '#/components/responses/502BadGateway'

