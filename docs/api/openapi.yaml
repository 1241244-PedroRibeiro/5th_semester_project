  # 11. CATALOGUE QUERY (BCK11)
  # =========================================================================
  /catalogue:
    get:
      tags: [Catalogue Query]
      summary: Public catalogue (sellable products, sizes, prices, availability)
      operationId: getPublicCatalogue
