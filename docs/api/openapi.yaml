  # =========================================================================
  # 6. PRODUCTS (BCK05 + AI06 export)
  # =========================================================================
  /products:
    post:
      tags: [Products]
      summary: Create product (enforces type invariants)
      description: |
        Enforces (isSellable ∨ isPizzaComponent) === TRUE (Clarification #06).
        If isPizzaComponent, componentTypeName is mandatory. If isSellable,
        directSellingPrice is mandatory (≥ 0.00). If isStockControlled AND
        isSellable, stockUnitsPerSale must be provided (Clarification #28 §2).
      operationId: createProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequestDTO'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
        '422':
          $ref: '#/components/responses/422Unprocessable'
    get:
      tags: [Products]
      summary: List/filter products
      operationId: listProducts
      security:
        - BearerAuth: []
      parameters:
        - name: categoryName
          in: query
          schema:
            type: string
        - name: categoryCode
          in: query
          description: Sprint 1 alias for categoryName.
          schema:
            type: string
        - name: isSellable
          in: query
          schema:
            type: boolean
        - name: isPizzaComponent
          in: query
          schema:
            type: boolean
        - name: isStockControlled
          in: query
          schema:
            type: boolean
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /products/{sku}:
    get:
      tags: [Products]
      summary: Retrieve product by SKU
      operationId: getProductBySku
      security:
