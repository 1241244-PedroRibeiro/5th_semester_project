  # =========================================================================
  # 15. AI PLANNING EXECUTIONS (AI01, AI02, AI05, AI06, ADR-012, ADR-013)
  # =========================================================================
  /planning/bom-executions:
    post:
      tags: [AI Planning]
      summary: Execute Bill of Materials (BOM) and Stock Requirements (AI01)
      description: |
        Calculates the required raw materials and components for a list of ordered pizzas.
        Uses available stock first, reporting hypothetical remaining units and replenishment needs.
        This endpoint is strictly read-only (does not mutate stock).
      operationId: executeBom
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BomExecutionRequestDTO'
      responses:
        '201':
          description: BOM executed successfully; result persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningResultResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422Unprocessable'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /planning/executions:
    post:
      tags: [AI Planning]
      summary: Execute Requirements Planning via Prolog (AI02)
      description: |
        Orchestration (ADR-012, ADR-013):
          1. Load forecast + scenario + stock + BOM.
          2. PlanningSnapshotDomainService captures deep JSON snapshots.
          3. Validate all references are active (Clarification #28).
          4. Call PrologHttpClient → 502 Bad Gateway if unavailable.
          5. Persist immutable PlanningResult with snapshots and outputs.
        Never mutates stock and never creates PurchaseOrders
        (Clarification #26).
      operationId: executePlanning
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningExecutionRequestDTO'
      responses:
        '201':
          description: Planning executed; read-only result persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningResultResponseDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Forecast or scenario not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '409':
          description: |
            Scenario not confirmed, or reference became inactive since
            creation (Clarification #28 follow-up).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: |
            Missing stockUnitsPerSale for a isStockControlled ∧ isSellable
            product (Clarification #28 §2), or invalid BOM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '502':
          $ref: '#/components/responses/502BadGateway'
    get:
      tags: [AI Planning]
      summary: List historical planning results
      operationId: listPlanningExecutions
      security:
        - BearerAuth: []
      parameters:
        - name: forecastName
          in: query
          schema:
            type: string
        - name: scenarioName
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageStartIndex'
      responses:
        '200':
          description: Historical results (most recent first).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanningResultResponseDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /planning/executions/{executionId}:
    get:
      tags: [AI Planning]
      summary: Retrieve a planning result (read-only)
      operationId: getPlanningExecution
      security:
        - BearerAuth: []
      parameters:
