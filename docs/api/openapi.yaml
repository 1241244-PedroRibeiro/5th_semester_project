    get:
      tags: [Predefined Pizzas]
      summary: Retrieve recipe by SKU
      description: |
        Optional pizzaSize query parameter restricts the response to one
        size variant (Sprint 1 contract).
      operationId: getPredefinedPizza
      security: []
      parameters:
        - name: pizzaSize
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedPizzaResponseDTO'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      tags: [Predefined Pizzas]
      summary: Replace a predefined pizza recipe and its available sizes (Manager only)
      description: |
        Replaces the shared default recipe and the complete set of
        available sizes atomically. Every ingredient must be active and
        configured for every selected active size. Assembly cardinality
        rules are enforced. The SKU is immutable.
      operationId: updatePredefinedPizza
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePredefinedPizzaRequestDTO'
