        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          description: Ingredients, size configurations or cardinality rules are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # =========================================================================
  # ITEM PICTURES (ADR-018)
  # =========================================================================
  /images/{identifier}:
    parameters:
      - name: identifier
        in: path
        required: true
        description: |
          Product SKU, product name (case-insensitive) or predefined pizza
          recipe name (case-insensitive), resolved in that order.
        schema:
          type: string
          example: PIZ-MARGHERITA
    get:
      tags: [Item Pictures]
      summary: Retrieve the picture of a product or pizza
      description: |
        Returns the stored picture in its native media type. When the item
        does not exist or has no picture, returns 200 with a default SVG
        picture stating that there is no image related to the item, flagged
        by `X-Image-Placeholder: true` (ADR-005.2).
      operationId: getItemPicture
      security: []
      responses:
        '200':
          description: Stored picture, or the default picture.
          headers:
            X-Image-Placeholder:
              description: '`true` when the default picture is returned.'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/400BadRequest'
    post:
      tags: [Item Pictures]
      summary: Upload or replace the picture of a product or pizza (Manager only)
      description: |
        Stores the picture as `<SKU>.<ext>`, replacing any previous picture
        of the item. JPEG, PNG, WEBP or GIF up to 5 MB; the file content must
        match its declared type. Sent by the back-office after creating or
        editing a product or predefined pizza.
      operationId: uploadItemPicture
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Picture stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku: { type: string, example: PIZ-MARGHERITA }
                  fileName: { type: string, example: PIZ-MARGHERITA.jpg }
                  contentType: { type: string, example: image/jpeg }
                  size: { type: integer, example: 261232 }
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '413':
          description: File larger than 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

