limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=2r/s;

server {
	listen 80;
	server_name localhost;

	return 308 https://$host$request_uri;
}

server {
	listen 443 ssl;
	server_name localhost;

	ssl_certificate /etc/nginx/certs/site.crt;
	ssl_certificate_key /etc/nginx/certs/site.key;
	ssl_protocols TLSv1.2 TLSv1.3;

	root /usr/share/nginx/html;
	index index.html;


	# For the locations another approach could be setting them individually
	# Example:
	#	location /auth {
	#		proxy_pass http://backend:3000;
	#	}

	location = /api {
		return 308 /api/;
	}

	# The public API contract uses /api/v1; the backend controllers are
	# versioned at the gateway boundary and receive the path without it.
	location ^~ /api/v1/ {
		proxy_pass http://backend:3000/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Item pictures through the versioned contract path (same rules as below): served by the backend ImageController. Kept out of the
	# strict /api/ rate limit (a catalogue page loads many images at once)
	# and allows uploads up to the backend's 5 MB limit.
	location ^~ /api/v1/images/ {
		limit_req zone=api_per_ip burst=100 nodelay;
		limit_req_status 429;
		client_max_body_size 6m;

		proxy_pass http://backend:3000/images/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Item pictures: served by the backend ImageController. Kept out of the
	# strict /api/ rate limit (a catalogue page loads many images at once)
	# and allows uploads up to the backend's 5 MB limit.
	location ^~ /api/images/ {
		limit_req zone=api_per_ip burst=100 nodelay;
		limit_req_status 429;
		client_max_body_size 6m;

		proxy_pass http://backend:3000/images/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ^~ /api/ {
		limit_req zone=api_per_ip burst=20 nodelay;
		limit_req_status 429;

		proxy_pass http://backend:3000/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ^~ /auth/external/ {
		proxy_pass http://backend:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	# Os assets 3D em falta devolvem 404,
	# em vez de devolver o index.html da aplicação.
	location ^~ /assets/3d/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=3600";
	}
}


# Internal HTTP endpoint used exclusively by the backend
# to validate the existence of 3D model assets.
server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    location ^~ /assets/3d/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        return 404;
    }
}
