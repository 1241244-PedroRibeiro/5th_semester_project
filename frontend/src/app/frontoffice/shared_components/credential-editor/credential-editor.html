<app-modal
	[title]="
		(kind() === 'password' ? ('Change password' | translate) : ('Change email' | translate))
			| translate
	"
	[description]="'Account security' | translate"
	(closed)="closed.emit()"
	><div class="stack">
		<p class="shop-notice" role="status">
			{{ kind() === 'password' ? ('Password changes' | translate) : ('Email changes' | translate) }}
			{{
				'are not available yet. This form cannot save changes until the account service supports them.'
					| translate
			}}
		</p>
		<label class="shop-field"
			>{{ 'Current password' | translate
			}}<input
				type="password"
				[(ngModel)]="currentPassword"
				autocomplete="current-password"
				[placeholder]="'Enter current password' | translate"
		/></label>
		@if (kind() === 'password') {
			<label class="shop-field"
				>{{ 'New password' | translate
				}}<input
					type="password"
					[(ngModel)]="password"
					autocomplete="new-password"
					[placeholder]="'Enter new password' | translate" /></label
			><app-password-rules [value]="password" />
		} @else {
			<label class="shop-field"
				>{{ 'New email' | translate
				}}<input
					type="email"
					[(ngModel)]="email"
					autocomplete="email"
					[placeholder]="'Enter new email' | translate"
			/></label>
		}
	</div>
	<div modal-actions class="row-actions">
		<button shopButton tone="secondary" (click)="closed.emit()">{{ 'Close' | translate }}</button
		><button shopButton disabled>{{ 'Save changes' | translate }}</button>
	</div></app-modal
>
